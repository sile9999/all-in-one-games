<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蕉蛙遊戲大廳 My Game Hub</title>
  <style>
    /* 這裡就是 style.css 的內容，直接包在 HTML 裡 */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    header h1 {
      color: #333;
    }

    .game-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 1000px;
      margin: 30px auto;
    }

    .game-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 24px;
      width: 200px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .game-card:hover {
      transform: translateY(-5px);
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 歡迎來到小遊戲大廳</h1>
    <p>請選擇你想遊玩的遊戲：</p>
  </header>

  <main class="game-container">
    <div class="game-card">
      <h2>GOGO 遊戲</h2>
      <p>快節奏冒險小遊戲</p>
      <a href="games/gogo/index.html" class="btn">開始遊戲</a>
    </div>

    <div class="game-card">
      <h2>數字挑戰</h2>
      <p>考驗腦力的數字遊戲</p>
      <a href="games/number/index.html" class="btn">開始遊戲</a>
    </div>

    <div class="game-card">
      <h2>賓果 BINGO</h2>
      <p>經典賓果連線遊戲</p>
      <a href="games/bingo/index.html" class="btn">開始遊戲</a>
    </div>

    <div class="game-card">
      <h2>LALACA 遊戲</h2>
      <p>趣味休閒小遊戲</p>
      <a href="games/lalaca/index.html" class="btn">開始遊戲</a>
    </div>
  </main>
</body>
</html>
