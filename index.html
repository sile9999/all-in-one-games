<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>經典小遊戲大廳 </title>
  <style>
    /* --- 1. 背景獨立容器（跨裝置完美滿版縮放） --- */
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* 放在最底層 */
      object-fit: cover; /* 自動等比例填滿畫面，不變形 */
      object-position: center center; /* 置中呈現 */
    }

    /* --- 2. 全域設定 --- */
    body {
      font-family: Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 30px 20px;
      text-align: center;
      color: #ffffff;
      min-height: 100vh;
      box-sizing: border-box;
      /* 禁止選取文字，防止拖曳內容 */
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

    /* --- 3. 大廳標題 --- */
    header h1 {
      font-size: 2.2em;
      margin-bottom: 35px;
      color: #fff;
      /* 加上黑陰影與藍紫色霓虹發光，確保在背景上文字清晰 */
      text-shadow: 0 0 10px #00f0ff, 2px 2px 5px rgba(0, 0, 0, 0.8);
    }

    /* --- 4. 遊戲卡片容器 (改用 CSS Grid 鎖定一列二格) --- */
    .game-container {
      display: grid;
      grid-template-columns: repeat(2, 280px); /* 桌上型/平板預設一列二格 (每格寬度 280px) */
      justify-content: center;
      gap: 30px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* RWD 手機規格：當螢幕寬度小於 600px 時，切換回一列一格 */
    @media (max-width: 600px) {
      .game-container {
        grid-template-columns: repeat(1, 100%); /* 手機單欄顯示 */
        max-width: 320px;
      }
    }

    /* --- 5. 遊戲圖片連結區塊 --- */
    .game-link {
      display: block;
      width: 100%; /* 寬度自動填滿 Grid 格子 */
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #ffcc00; /* 金黃色邊框 */
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.4), 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      background-color: rgba(18, 12, 38, 0.85);
      box-sizing: border-box;
    }

    /* 滑鼠懸停時圖片放大與發光效果 */
    .game-link:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.9), 0 10px 20px rgba(0, 0, 0, 0.7);
    }

    /* --- 6. 遊戲圖片樣式 --- */
    .game-icon {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none; /* 防止圖片被單獨右鍵存檔或拖曳 */
    }
  </style>
</head>
<body>

  <!-- 背景圖片容器：自動適應任何裝置螢幕尺寸 -->
  <img class="bg-layer" src="https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images2/BK01.png" alt="背景圖">

  <header>
    <h1>🎮 經典小遊戲大廳 🎮</h1>
  </header>

  <main class="game-container">
    <!-- 遊戲 1: GOGO 遊戲 -->
    <a href="games/gogo/index.html" class="game-link">
      <img src="https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images2/gogo01.png" alt="GOGO 遊戲" class="game-icon">
    </a>

    <!-- 遊戲 2: 賓果 BINGO -->
    <a href="games/bingo/index.html" class="game-link">
      <img src="https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images2/bingo01.png" alt="賓果 BINGO" class="game-icon">
    </a>

    <!-- 遊戲 3: LALACA 遊戲 -->
    <a href="games/lalaca/index.html" class="game-link">
      <img src="https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images2/lalaca01.png" alt="LALACA 遊戲" class="game-icon">
    </a>

    <!-- 遊戲 4: 數字挑戰 -->
    <a href="games/number/index.html" class="game-link">
      <img src="https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images2/number01.png" alt="數字挑戰" class="game-icon">
    </a>

    <!-- 遊戲 5: 種菜 539 -->
    <a href="games/539/index.html" class="game-link">
      <img src="https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images2/539.png" alt="種菜 539" class="game-icon">
    </a>

    <!-- 遊戲 6: 數學消消樂 POPO -->
    <a href="games/popo/index.html" class="game-link">
      <img src="https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images2/popo.png" alt="數學消消樂 POPO" class="game-icon">
    </a>

    <!-- 遊戲 7: NO2 遊戲 -->
    <a href="games/no2/index.html" class="game-link">
      <img src="https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images2/no2.png" alt="NO2 遊戲" class="game-icon">
    </a>
  </main>

  <!-- 防 F12 與開發者工具指令碼 -->
  <script>
    // 1. 禁用右鍵選單
    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });

    // 2. 禁用快捷鍵 (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+U)
    document.addEventListener('keydown', function (e) {
      // F12
      if (e.keyCode === 123) {
        e.preventDefault();
        return false;
      }
      // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
      if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
        e.preventDefault();
        return false;
      }
      // Ctrl+U (檢視原始碼)
      if (e.ctrlKey && e.keyCode === 85) {
        e.preventDefault();
        return false;
      }
      // Ctrl+S (儲存網頁)
      if (e.ctrlKey && e.keyCode === 83) {
        e.preventDefault();
        return false;
      }
    });

    // 3. 定時用 debugger 阻擋開啟控制台的使用者
    setInterval(function() {
      const startTime = performance.now();
      (function() {}.constructor('debugger')());
      const endTime = performance.now();
      // 若開啟開發者工具，執行 debugger 會造成暫停，執行時間會顯著增加
      if (endTime - startTime > 100) {
        window.location.reload(); // 或可跳轉至其他頁面
      }
    }, 1000);
  </script>

</body>
</html>
