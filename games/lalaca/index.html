<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 翻牌連連看 </title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    
    /* 修正點 2：加入指定背景圖片並設定居中 cover 貼合 */
    body { 
      background-color: #f0f4f8; 
      background-image: url('https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images2/BK01.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 16px; 
    }
    
    .container { background: rgba(255, 255, 255, 0.95); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 680px; text-align: center; position: relative; }
    h1 { color: #2c3e50; margin-bottom: 16px; font-size: 22px; text-align: center; }
    
    /* 修正點 1：大廳按鈕專用置中樣式 */
    .btn-lobby {
      display: inline-block;
      width: auto;
      min-width: 180px;
      padding: 10px 20px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin: 0 auto 16px auto;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-lobby:hover { background-color: #0369a1; }

    .menu-group { margin-bottom: 16px; text-align: left; }
    .menu-group label { display: block; font-weight: bold; color: #34495e; margin-bottom: 8px; font-size: 14px; }
    
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-option { flex: 1; min-width: 60px; padding: 8px 4px; border: 2px solid #cbd5e1; border-radius: 8px; background: white; cursor: pointer; font-weight: bold; color: #475569; text-align: center; font-size: 12px; }
    .btn-option.active { border-color: #3b82f6; background-color: #eff6ff; color: #1d4ed8; }
    
    .input-box { width: 100%; padding: 10px 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 15px; font-weight: bold; outline: none; margin-bottom: 10px; }
    
    .btn-primary { width: 100%; padding: 12px; background-color: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px; transition: all 0.2s ease; }
    .btn-primary:hover { background-color: #2563eb; }
    .btn-admin { background-color: #64748b; }
    .btn-admin:hover { background-color: #475569; }
    .btn-copy { background-color: #8b5cf6; }
    .btn-copy:hover { background-color: #7c3aed; }
    .btn-start { background-color: #10b981; }
    .btn-start:hover { background-color: #059669; }

    .btn-success-state { background-color: #059669 !important; transform: scale(0.98); }

    .room-display-box { background: #f1f5f9; border: 2px dashed #94a3b8; border-radius: 8px; padding: 12px; text-align: center; margin-top: 12px; }
    .room-number { font-size: 28px; font-weight: bold; color: #2563eb; letter-spacing: 2px; }

    .status-bar { display: flex; justify-content: space-between; background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-weight: bold; color: #334155; }
    .grid-container { position: relative; margin-bottom: 16px; }
    
    /* 預設網格結構 (JS動態給予 grid-template-columns) */
    .grid { display: grid; gap: 8px; }

    /* 未翻牌卡牌基礎樣式 */
    .tile { aspect-ratio: 1; background-color: #81e6d9; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; color: #1e293b; cursor: pointer; transition: transform 0.1s, background-color 0.2s; position: relative; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .tile:hover { transform: scale(1.04); }
    
    /* 已翻牌/成功配對樣式 */
    .tile.selected { background-color: #ffffff; border: 3px solid #fde047; transform: scale(0.95); }
    .tile.error { background-color: #fca5a5; animation: shake 0.3s; }
    
    /* 成語文字專用樣式 */
    .tile-text { 
      font-size: 18px; 
      font-weight: bold; 
      color: #1e293b; 
      text-align: center; 
      line-height: 1.2; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      width: 100%; 
      height: 100%; 
      padding: 4px;
      word-break: break-all;
    }

    /* 手機螢幕裝置專用 (螢幕寬度 <= 600px) */
    @media (max-width: 600px) {
      /* 24格（含以下）：4格一列 */
      .grid, .grid.grid-24 { 
        grid-template-columns: repeat(4, 1fr) !important; 
        gap: 8px !important; 
      }

      /* 24格以上（36~96格）：6格一列 */
      .grid.grid-large { 
        grid-template-columns: repeat(6, 1fr) !important; 
        gap: 4px !important; 
      }

      .tile { 
        font-size: 24px; 
        border-radius: 8px; 
      }
      
      .tile-text {
        font-size: 12px;
        padding: 2px;
      }
    }

    .game-over-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold; z-index: 10; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    .leaderboard { background: #eff6ff; border: 2px solid #bfdbfe; padding: 12px; border-radius: 8px; margin-top: 16px; text-align: left; }
    .leaderboard-title { font-size: 14px; font-weight: bold; color: #1e40af; margin-bottom: 8px; }
    .leaderboard-item { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; color: #334155; border-bottom: 1px dashed #cbd5e1; }
    .leaderboard-item.me { font-weight: bold; color: #2563eb; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 360px; text-align: center; }
    
    .hidden { display: none !important; }
    .disabled-area { opacity: 0.5; pointer-events: none; }

    /* 活動結束專用全螢幕樣式 */
    .expired-card { background: white; padding: 40px 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
    .expired-icon { font-size: 64px; margin-bottom: 16px; }
    .expired-title { color: #ef4444; font-size: 24px; font-weight: bold; margin-bottom: 12px; }
    .expired-desc { color: #64748b; font-size: 15px; line-height: 1.6; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfajfgTmrYRSo7lyRa4j23rsODFzFZSRY",
      authDomain: "gogogame-ce8ba.firebaseapp.com",
      databaseURL: "https://gogogame-ce8ba-default-rtdb.firebaseio.com",
      projectId: "gogogame-ce8ba",
      storageBucket: "gogogame-ce8ba.firebasestorage.app",
      messagingSenderId: "823932242561",
      appId: "1:823932242561:web:7aaea77c9d8cf300b15b80"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 四字成語題庫
    const idiomPool = [
      "一心一意", "三心二意", "四海為家", "五湖四海", "六六大順", "七上八下", "八仙過海", "九牛一毛", 
      "十全十美", "百發百中", "千方百計", "萬無一失", "守株待兔", "畫蛇添足", "胸有成竹", "拔苗助長", 
      "盲人摸象", "井底之蛙", "對牛彈琴", "刻舟求劍", "狐假虎威", "亡羊補牢", "葉公好龍", "自相矛盾", 
      "掩耳盜鈴", "買櫝還珠", "愚公移山", "精衛填海", "夸父追日", "女媧補天", "嫦娥奔月", "後羿射日", 
      "水滴石穿", "海枯石爛", "風調雨順", "國泰民安", "車水馬龍", "門庭若市", "欣欣向榮", "蓬勃發展", 
      "迎刃而解", "破竹之勢", "勢如破竹", "全力以赴", "堅持不懈", "持之以恆", "腳踏實地", "實事求是", 
      "同心協力", "眾志成城", "臥薪嘗膽", "聞雞起舞", "懸梁刺股", "程門立雪", "鑿壁偷光", "錦上添花",
      "雪中送炭", "溫故知新", "學無止境", "學以致用", "溫文儒雅", "高瞻遠矚", "一馬當先", "出類拔萃"
    ];

    let roomId = null;
    let playerId = 'usr_' + Math.random().toString(36).substring(2, 7);
    let playerName = '';
    let totalTiles = 24;
    let gridTiles = [];
    let matchedTiles = [];
    let selectedIndices = [];
    let timer = null;
    let roomRef = null;
    let currentPlayers = {};
    let isGameActive = false;
    let isCheckingPair = false;
    let startTime = null;
    let timeUsedMs = null;
    let roomSettings = { totalTiles: 24, endTime: null };

    window.openAdminModal = openAdminModal;
    window.checkPassword = checkPassword;
    window.createRoom = createRoom;
    window.copyRoomLink = copyRoomLink;
    window.copyScores = copyScores;
    window.openJoinModalNewTab = openJoinModalNewTab;
    window.joinRoomGame = joinRoomGame;
    window.closeModal = closeModal;
    window.goToLobby = goToLobby; // 修正點 1：綁定全域轉跳函式

    window.addEventListener('DOMContentLoaded', async () => {
      setupOptionGroup('grid-options', (val) => totalTiles = parseInt(val));

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');

      if (roomParam) {
        document.getElementById('main-setup-view').classList.add('hidden');
        document.getElementById('input-room-id').value = roomParam;

        const snapshot = await get(ref(db, 'rooms_v4/' + roomParam));
        const data = snapshot.val();
        if (data && data.endTime && Date.now() > data.endTime) {
          showExpiredScreen();
        } else {
          document.getElementById('join-modal').classList.remove('hidden');
        }
      }

      initSecurity();
    });

    // 修正點 1：轉跳遊戲大廳函式（直接轉跳不另開新視窗）
    function goToLobby() {
      window.location.href = 'https://sile9999.github.io/all-in-one-games/';
    }

    function showExpiredScreen() {
      document.getElementById('main-setup-view').classList.add('hidden');
      document.getElementById('player-game-view').classList.add('hidden');
      document.getElementById('join-modal').classList.add('hidden');
      document.getElementById('expired-view').classList.remove('hidden');
    }

    function setupOptionGroup(groupId, callback) {
      const group = document.getElementById(groupId);
      group.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-option')) {
          Array.from(group.children).forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          callback(e.target.dataset.val || e.target.dataset.mode);
        }
      });
    }

    function openAdminModal() {
      document.getElementById('pwd-modal').classList.remove('hidden');
    }

    function checkPassword() {
      const pwd = document.getElementById('admin-pwd').value;
      if (pwd === '17696969') {
        document.getElementById('pwd-modal').classList.add('hidden');
        document.getElementById('setting-fields').classList.remove('disabled-area');
        document.getElementById('admin-unlock-btn').classList.add('hidden');
        
        document.getElementById('create-room-btn').classList.remove('hidden');
        document.getElementById('sim-join-btn').classList.remove('hidden');
      } else {
        alert('密碼錯誤！');
      }
    }

    function createRoom() {
      const noteText = document.getElementById('admin-note-input').value.trim();
      const endTimeVal = document.getElementById('admin-endtime-input').value;

      let endTimeStamp = null;
      if (endTimeVal) {
        endTimeStamp = new Date(endTimeVal).getTime();
      }

      roomId = Math.floor(100000 + Math.random() * 900000).toString();
      roomRef = ref(db, 'rooms_v4/' + roomId);

      if (totalTiles % 2 !== 0) totalTiles -= 1;

      set(roomRef, {
        totalTiles: totalTiles,
        note: noteText,
        endTime: endTimeStamp,
        players: {}
      });

      document.getElementById('room-num-display').innerText = roomId;
      document.getElementById('admin-action-area').classList.remove('hidden');

      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        currentPlayers = data.players || {};
        renderLeaderboard('admin-leaderboard-list', currentPlayers);
      });
    }

    function copyRoomLink(btn) {
      if (!roomId) return;
      const baseUrl = window.location.origin + window.location.pathname;
      const fullLink = `${baseUrl}?room=${roomId}`;
      const noteText = document.getElementById('admin-note-input').value.trim() || '無';
      const endTimeVal = document.getElementById('admin-endtime-input').value;
      const endTimeText = endTimeVal ? endTimeVal.replace('T', ' ') : '無限制';

      let copyMsg = `🎮 成語連連看挑戰房\n`;
      copyMsg += `🔗 遊戲連結：${fullLink}\n`;
      copyMsg += `⏱️ 競賽模式：完成耗時比拼\n`;
      copyMsg += `⏳ 結束時間：${endTimeText}\n`;
      copyMsg += `💡 說明：點擊連結進入後即可開始個人計時挑戰！\n`;
      copyMsg += `📝 備註：${noteText}\n`;

      navigator.clipboard.writeText(copyMsg).then(() => {
        triggerButtonFeedback(btn, '✅ 已複製房間連結！', '📋 複製房號與連結');
      }).catch(() => {});
    }

    function copyScores(btn) {
      if (!currentPlayers || Object.keys(currentPlayers).length === 0) return;
      
      const sorted = Object.values(currentPlayers).sort((a, b) => {
        if (a.status === 'ended' && b.status !== 'ended') return -1;
        if (a.status !== 'ended' && b.status === 'ended') return 1;
        return (a.timeUsedMs || Infinity) - (b.timeUsedMs || Infinity);
      });

      let text = `🏆【 成語翻牌排行榜】\n📍 房號：${roomId || '無'}\n-------------------\n`;
      sorted.forEach((p, idx) => { 
        const timeStr = p.timeUsedMs ? `${(p.timeUsedMs / 1000).toFixed(3)} 秒` : '進行中/未完成';
        text += `第 ${idx + 1} 名: ${p.name} - 耗時: ${timeStr}\n`; 
      });

      navigator.clipboard.writeText(text).then(() => {
        triggerButtonFeedback(btn, '✅ 已複製戰報成績！', '🏆 複製戰報成績');
      }).catch(() => {});
    }

    function triggerButtonFeedback(btnElement, activeText, originalText) {
      if (!btnElement) return;
      btnElement.innerText = activeText;
      btnElement.classList.add('btn-success-state');
      setTimeout(() => {
        btnElement.innerText = originalText;
        btnElement.classList.remove('btn-success-state');
      }, 1200);
    }

    function openJoinModalNewTab() {
      const baseUrl = window.location.origin + window.location.pathname;
      const targetUrl = roomId ? `${baseUrl}?room=${roomId}` : baseUrl;
      window.open(targetUrl, '_blank');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function joinRoomGame() {
      const inputRoom = document.getElementById('input-room-id').value.trim();
      const inputName = document.getElementById('input-player-name').value.trim();

      if (!inputRoom) return alert('請輸入房號！');
      if (!inputName) return alert('請輸入暱稱！');

      roomId = inputRoom;
      playerName = inputName;
      roomRef = ref(db, 'rooms_v4/' + roomId);

      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return alert('找不到該房間，請確認房號是否正確！');

        if (data.endTime && Date.now() > data.endTime) {
          showExpiredScreen();
          return;
        }

        roomSettings.totalTiles = data.totalTiles || 24;
        totalTiles = roomSettings.totalTiles;

        const pairCount = totalTiles / 2;
        
        // 隨機從成語庫中抽取 pairCount 個不重複成語
        const shuffledPool = [...idiomPool].sort(() => Math.random() - 0.5);
        const selectedIdioms = shuffledPool.slice(0, pairCount);

        // 每組成語生成 2 張卡牌並洗牌
        let idioms = [];
        selectedIdioms.forEach(item => {
          idioms.push(item, item);
        });
        idioms.sort(() => Math.random() - 0.5);

        gridTiles = idioms;
        matchedTiles = [];
        timeUsedMs = null;
        selectedIndices = [];
        isGameActive = true;

        update(ref(db, `rooms_v4/${roomId}/players/${playerId}`), { 
          name: playerName, 
          timeUsedMs: null,
          status: 'playing'
        });

        document.getElementById('join-modal').classList.add('hidden');
        document.getElementById('main-setup-view').classList.add('hidden');
        document.getElementById('player-game-view').classList.remove('hidden');

        // 記錄開始遊戲精準時間 (毫秒)
        startTime = Date.now();
        renderGrid();
        startPersonalTimer();
        listenLeaderboard();

      }, { onlyOnce: true });
    }

    function startPersonalTimer() {
      if (timer) clearInterval(timer);
      
      timer = setInterval(() => {
        if (!isGameActive) return;
        const now = Date.now();
        const elapsed = ((now - startTime) / 1000).toFixed(1);
        document.getElementById('time-display').innerText = elapsed + 's';
      }, 100);
    }

    function listenLeaderboard() {
      onValue(ref(db, `rooms_v4/${roomId}/players`), (snapshot) => {
        const playersData = snapshot.val() || {};
        currentPlayers = playersData;
        renderLeaderboard('player-leaderboard-list', playersData);
      });
    }

    function renderGrid() {
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';

      // 1. 設定手機版專用的格子類別標記 (<=24格為4欄，>24格為6欄)
      if (totalTiles <= 24) {
        gridEl.className = 'grid grid-24';
      } else {
        gridEl.className = 'grid grid-large';
      }

      // 2. 大螢幕（桌機 / 平板，螢幕寬度 > 600px）的動態欄數設定
      let cols = 6;
      if (totalTiles <= 48) cols = 6;
      else cols = 8;

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      // 3. 渲染卡牌成語
      gridTiles.forEach((val, idx) => {
        const tile = document.createElement('div');
        const isMatched = matchedTiles.includes(idx);
        const isSelected = selectedIndices.includes(idx);

        let tileClass = 'tile';
        const isRevealed = isMatched || isSelected;

        if (isRevealed) {
          tileClass += ' selected';
          tile.className = tileClass;
          tile.innerHTML = `<span class="tile-text">${val}</span>`;
        } else {
          tile.className = tileClass;
          tile.innerText = '👻';
        }

        if (!isMatched && !isCheckingPair && isGameActive) {
          tile.onclick = () => handleTileClick(idx);
        }

        gridEl.appendChild(tile);
      });
    }

    function handleTileClick(index) {
      if (!isGameActive || isCheckingPair) return;
      if (selectedIndices.includes(index) || matchedTiles.includes(index)) return;

      selectedIndices.push(index);
      renderGrid();

      if (selectedIndices.length === 2) {
        const [firstIdx, secondIdx] = selectedIndices;
        
        if (gridTiles[firstIdx] === gridTiles[secondIdx]) {
          matchedTiles.push(firstIdx, secondIdx);
          selectedIndices = [];
          renderGrid();

          // 判斷是否全部配對完畢
          if (matchedTiles.length === gridTiles.length) {
            const finishTime = Date.now();
            timeUsedMs = finishTime - startTime; // 計算消耗毫秒數

            if (timer) clearInterval(timer);
            isGameActive = false;
            
            const secondsFormatted = (timeUsedMs / 1000).toFixed(3);
            document.getElementById('final-time-text').innerText = `完成總耗時：${secondsFormatted} 秒`;
            document.getElementById('game-over-mask').classList.remove('hidden');

            // 更新完成時間與狀態至 Firebase
            update(ref(db, `rooms_v4/${roomId}/players/${playerId}`), { 
              timeUsedMs: timeUsedMs,
              status: 'ended'
            });
          }
        } else {
          isCheckingPair = true;
          const tiles = document.querySelectorAll('.tile');
          tiles[firstIdx]?.classList.add('error');
          tiles[secondIdx]?.classList.add('error');

          setTimeout(() => {
            selectedIndices = [];
            isCheckingPair = false;
            renderGrid();
          }, 800);
        }
      }
    }

    function renderLeaderboard(elementId, players) {
      const lbEl = document.getElementById(elementId);
      if (!lbEl) return;
      
      // 排序規則：已完成者排前面，同為已完成者比用時（短到長，毫秒級別）
      const sorted = Object.entries(players)
        .map(([id, p]) => ({ id, ...p }))
        .sort((a, b) => {
          if (a.status === 'ended' && b.status !== 'ended') return -1;
          if (a.status !== 'ended' && b.status === 'ended') return 1;
          return (a.timeUsedMs || Infinity) - (b.timeUsedMs || Infinity);
        });

      lbEl.innerHTML = sorted.map((p, idx) => {
        let timeDisplay = '挑戰中...';
        if (p.timeUsedMs) {
          const secondsFormatted = (p.timeUsedMs / 1000).toFixed(3);
          timeDisplay = `<span style="color:#059669;">⏱️ ${secondsFormatted}秒</span>`;
        }

        return `
          <div class="leaderboard-item ${p.id === playerId ? 'me' : ''}">
            <span>#${idx + 1} ${p.name} ${p.id === playerId ? '(你)' : ''}</span>
            <span>${timeDisplay} ${p.status === 'ended' ? '(已完成)' : ''}</span>
          </div>
        `;
      }).join('') || '<div style="color:#94a3b8; font-size:13px;">尚無玩家資料...</div>';
    }

    function initSecurity() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }
  </script>
</head>
<body>

<div id="pwd-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3 style="margin-bottom:12px; color:#1e293b;">管理者身分驗證</h3>
    <input type="password" id="admin-pwd" class="input-box" placeholder="請輸入管理者密碼">
    <button class="btn-primary" onclick="checkPassword()">確認驗證</button>
    <button class="btn-primary btn-admin" style="margin-top:8px;" onclick="closeModal('pwd-modal')">取消</button>
  </div>
</div>

<div id="join-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3 style="margin-bottom:16px; color:#1e293b;">進入挑戰房間</h3>
    <input type="text" id="input-room-id" class="input-box" placeholder="輸入 6 位數房號" maxlength="6">
    <input type="text" id="input-player-name" class="input-box" placeholder="輸入你的暱稱" maxlength="10">
    <button class="btn-primary" onclick="joinRoomGame()">開始個人挑戰</button>
  </div>
</div>

<div id="main-setup-view" class="container">
  <!-- 修正點 1：加入回到遊戲大廳按鈕 -->
  <button class="btn-lobby" onclick="goToLobby()">🏠 回到遊戲大廳</button>

  <h1>⚙️  成語翻牌連連看 </h1>

  <div id="setting-fields" class="disabled-area">
    <div class="menu-group">
      <label>盤面卡牌總數：</label>
      <div class="btn-group" id="grid-options">
        <button class="btn-option active" data-val="24">24格</button>
        <button class="btn-option" data-val="36">36格</button>
        <button class="btn-option" data-val="48">48格</button>
        <button class="btn-option" data-val="60">60格</button>
        <button class="btn-option" data-val="72">72格</button>
        <button class="btn-option" data-val="84">84格</button>
        <button class="btn-option" data-val="96">96格</button>
      </div>
    </div>

    <div class="menu-group">
      <label>設定結束時間 (選填)：</label>
      <input type="datetime-local" id="admin-endtime-input" class="input-box">
    </div>

    <div class="menu-group">
      <label>房間備註說明 (選填)：</label>
      <input type="text" id="admin-note-input" class="input-box" placeholder="例：三年一班成語速度大賽" maxlength="30">
    </div>
  </div>

  <button id="admin-unlock-btn" class="btn-primary btn-admin" onclick="openAdminModal()">🔑 解鎖管理者設定</button>
  <button id="create-room-btn" class="btn-primary hidden" onclick="createRoom()">建立房間</button>
  <button id="sim-join-btn" class="btn-primary btn-start hidden" style="margin-top:10px;" onclick="openJoinModalNewTab()">🎮 房號加入 </button>

  <div id="admin-action-area" class="hidden">
    <div class="room-display-box">
      <div style="font-size:13px; color:#64748b; font-weight:bold;">當前房間號碼</div>
      <div class="room-number" id="room-num-display">------</div>
    </div>

    <button class="btn-primary btn-copy" onclick="copyRoomLink(this)">📋 複製房號與連結</button>
    <button class="btn-primary btn-copy" onclick="copyScores(this)">🏆 複製總排行榜成績</button>

    <div class="leaderboard">
      <div class="leaderboard-title">📊 排行榜 (即時更新)</div>
      <div id="admin-leaderboard-list"></div>
    </div>
  </div>
</div>

<div id="player-game-view" class="container hidden">
  <!-- 修正點 1：個人遊戲頁面亦可擺放大廳按鈕 -->
  <button class="btn-lobby" onclick="goToLobby()">🏠 回到遊戲大廳</button>

  <div class="status-bar">
    <div id="room-tag-display" style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">個人挑戰中</div>
    <div>已用時間: <span id="time-display">0.0s</span></div>
  </div>

  <div class="grid-container">
    <div class="grid" id="grid"></div>
    <div id="game-over-mask" class="game-over-overlay hidden">
      <div>🎉 恭喜完成挑戰！</div>
      <div id="final-time-text" style="font-size:16px; margin-top:8px; color:#fde047;">完成總耗時：-- 秒</div>
      <div style="font-size:14px; margin-top:8px; font-weight:normal;">請查看下方總排行榜了解名次</div>
    </div>
  </div>

  <div class="leaderboard">
    <div class="leaderboard-title">🏆 排行榜</div>
    <div id="player-leaderboard-list"></div>
  </div>
</div>

<div id="expired-view" class="expired-card hidden">
  <div class="expired-icon">⌛</div>
  <div class="expired-title">本次活動已結束</div>
  <div class="expired-desc">感謝您的關注！本房間的挑戰時間已過，目前已不再開放進入。</div>
  <br>
  <!-- 修正點 1：活動過期畫面亦有大廳轉跳按鈕 -->
  <button class="btn-lobby" style="margin-bottom:0;" onclick="goToLobby()">🏠 回到遊戲大廳</button>
</div>

</body>
</html>
