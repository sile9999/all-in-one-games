<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>四人麻將刮刮樂</title>
<style>
*{box-sizing:border-box;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;user-select:none}
body{margin:0;min-height:100vh;background:#0f5132;color:#fff;padding:14px}
.container{max-width:1100px;margin:auto}
.card{background:rgba(255,255,255,.96);color:#172033;border-radius:16px;padding:18px;box-shadow:0 10px 30px #0004;margin-bottom:14px}
h1,h2{margin:0 0 12px}
button,input{font:inherit}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:#fff}.success{background:#059669;color:#fff}.danger{background:#dc2626;color:#fff}.gray{background:#64748b;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{margin:8px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.input{width:100%;padding:10px;border:2px solid #cbd5e1;border-radius:8px}
#setup{max-width:620px;margin:8vh auto}.room{font-size:30px;font-weight:800;color:#2563eb;letter-spacing:3px}
.hidden{display:none!important}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.player{background:#f8fafc;color:#334155;border-radius:10px;padding:10px;border:2px solid #cbd5e1;min-height:70px}.player.me{border-color:#2563eb}.player.turn{box-shadow:0 0 0 3px #f59e0b}.player .name{font-weight:800}.player .state{font-size:12px;margin-top:5px}
.table{background:#166534;border-radius:18px;padding:14px;position:relative;min-height:420px}
.center{background:#14532d;border:2px solid #22c55e;border-radius:14px;min-height:110px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.center .big{font-size:34px;font-weight:900}.center .small{font-size:13px}
.hand-title{margin:12px 0 5px;font-weight:800}.hand{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.tile{width:42px;height:54px;border-radius:6px;background:#fff;color:#111827;border:1px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;box-shadow:0 2px 3px #0004;cursor:pointer}
.tile:hover{transform:translateY(-3px)}.tile.selected{background:#fde68a;border:3px solid #f59e0b}
.back{background:#0f766e;color:#d1fae5}.smalltile{width:28px;height:36px;font-size:17px;cursor:default}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.discard{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-height:100px;overflow:auto;margin-top:8px}
.log{background:#f8fafc;color:#334155;border-radius:10px;padding:10px;max-height:150px;overflow:auto;font-size:13px}
.scratch{max-width:420px;text-align:center;margin:7vh auto}.ticket{width:210px;height:125px;margin:14px auto;border-radius:14px;background:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:46px;cursor:pointer;border:5px dashed #fff}.ticket.revealed{background:#fff;color:#111;border:3px solid #f59e0b}.ticket img{max-width:180px;max-height:105px;object-fit:contain}.prize-row{display:grid;grid-template-columns:1fr 80px 100px 45px;gap:6px;align-items:center;margin:6px 0}.preview{width:42px;height:42px;object-fit:contain;border:1px solid #ddd;border-radius:5px}.lb table{width:100%;border-collapse:collapse}.lb th,.lb td{padding:7px;border-bottom:1px solid #ddd;text-align:left}
@media(max-width:700px){.players{grid-template-columns:repeat(2,1fr)}.tile{width:38px;height:49px;font-size:22px}.table{padding:8px}.prize-row{grid-template-columns:1fr 65px 80px 38px}}
</style>
</head>
<body>
<div id="setup" class="card">
<h1>🀄 四人麻將刮刮樂</h1>
<p id="setupDesc">四人同桌競賽，胡牌者取得一次刮刮樂。</p>
<div class="field"><label>你的暱稱</label><input id="name" class="input" placeholder="請輸入暱稱"></div>
<div class="field"><label>房號（加入既有房間時）</label><input id="joinRoom" class="input" placeholder="六位數房號"></div>
<div class="row">
<button id="joinBtn" type="button" class="primary">加入房間</button>
<button id="adminBtn" class="success" onclick="admin()">管理員建立房間</button>
</div>
<div id="joinStatus" style="margin-top:8px;font-size:13px;color:#475569"></div>
<div id="adminBox" class="hidden" style="margin-top:14px;border-top:1px solid #ddd;padding-top:12px">
<div class="field"><label>管理員密碼</label><input id="pwd" class="input" type="password"></div>
<div class="field"><label>刮刮樂總張數</label><input id="ticketCount" class="input" type="number" min="1" value="30"></div>
<div><b>獎項設定</b><div id="prizes"></div><button class="gray" onclick="addPrize()">＋新增獎項</button></div>
<button class="success" style="width:100%;margin-top:10px" onclick="createRoom()">建立四人麻將房</button>
</div>
<div id="roomInfo" class="hidden" style="margin-top:12px;border-top:1px solid #ddd;padding-top:12px">
  <div><b>房間已建立</b></div>
  <div>房號：<span id="roomNo" class="room"></span></div>
  <small>管理員只負責建立房間，不佔 4 名玩家名額。</small>
  <div class="field">
    <label>📎 玩家加入連結</label>
    <input id="joinLink" class="input" readonly>
  </div>
  <div id="adminRoomStatus" style="margin:8px 0;font-weight:800">目前 0 / 4 人，等待玩家加入</div>
  <div class="row">
    <button class="primary" onclick="copyLink()">複製連結</button>
    <button class="gray" onclick="copyRoom()">複製房號</button>
    <button class="success" onclick="watchGame()">觀看賽局</button>
  </div>
</div>
</div>

<div id="game" class="container hidden">
<div class="card">
<div class="row" style="justify-content:space-between"><h2>🀄 四人麻將</h2><div>房號：<b id="gameRoom"></b></div></div><div id="adminGameBar" class="row hidden" style="margin-bottom:10px"><button class="gray" onclick="backToRoomManager()">← 回到房間管理</button><span>管理員觀看模式（不佔玩家名額）</span></div>
<div id="players" class="players"></div>
<div id="adminGameToolbar" class="hidden" style="margin:12px 0;padding:14px;border:2px solid #d9a441;border-radius:12px;background:#fff8e6">
  <div style="font-weight:900;font-size:17px;margin-bottom:10px">👑 管理員控制</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button type="button" id="copyJoinLinkBtn">🔗 複製玩家加入連結</button>
    <button type="button" id="copyRoomBtn">📋 複製房號</button>
    <button type="button" id="restartGameBtn" class="success">🔄 結束本局／重新開局</button>
  </div>
  <div id="adminLinkText" style="margin-top:10px;font-size:13px;word-break:break-all"></div>
</div>
<div id="roomDebugPanel" style="margin:12px 0;padding:12px;border:2px solid #8bb8e8;border-radius:12px;background:#f3f8ff;font-size:14px;line-height:1.7">
  <div style="font-size:16px;font-weight:900">🀄 房間狀態</div>
  <div>玩家人數：<b id="debugPlayerCount">- / 4</b></div>
  <div>房間狀態：<b id="debugRoomStatus">讀取中</b></div>
  <div>開局狀態：<b id="debugStartStatus">等待房間資料</b></div>
  <div id="debugError" style="color:#b00020;font-weight:800"></div>
</div><div id="roomDebug" style="text-align:center;font-size:13px;color:#475569;margin:2px 0">Firebase：等待房間資料…</div><div id="seatStatus" style="text-align:center;font-weight:800;margin:8px 0;color:#334155"></div><div id="startDebug" style="text-align:center;font-size:14px;color:#475569;margin:4px 0">等待玩家加入…</div>
<div class="table">
<div class="center"><div class="big" id="turnText">等待四人...</div><div class="small" id="roundText">等待玩家加入</div></div>
<div class="hand-title">你的手牌</div><div id="myHand" class="hand"></div>
<div class="actions" id="actions"></div>
<div class="hand-title">牌池 / 出牌</div><div id="discards" class="discard"></div>
</div>
</div>
<div class="card"><h3>遊戲紀錄</h3><div id="log" class="log"></div></div>
<div class="card lb"><h3>🏆 刮刮樂排行榜</h3><div id="leaderboard"></div></div>
</div>

<div id="scratch" class="card scratch hidden">
<h2>🎉 恭喜胡牌！</h2><p>你獲得一次刮刮樂。</p>
<div id="ticket" class="ticket" onclick="revealScratch()">刮開</div>
<div id="scratchResult"></div>
<button class="primary" onclick="closeScratch()">回到麻將</button>
</div>

<script>
window.admin = window.admin || function(){
  const box=document.getElementById("adminBox");
  if(!box){ alert("找不到管理員設定區，請重新整理頁面。"); return; }
  box.classList.toggle("hidden");
  const prizes=document.getElementById("prizes");
  if(prizes && !prizes.children.length && typeof window.addPrize==="function") window.addPrize();
};
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import {getDatabase,ref,set,onValue,get,update,runTransaction} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDfajfgTmrYRSo7lyRa4j23rsODFzFZSRY",authDomain:"gogogame-ce8ba.firebaseapp.com",databaseURL:"https://gogogame-ce8ba-default-rtdb.firebaseio.com",projectId:"gogogame-ce8ba",storageBucket:"gogogame-ce8ba.firebasestorage.app",messagingSenderId:"823932242561",appId:"1:823932242561:web:7aaea77c9d8cf300b15b80"};
const PUBLIC_BASE_URL=null;
const app=initializeApp(firebaseConfig); const db=getDatabase(app); const auth=getAuth(app); let authReady=null;
async function ensureAuth(){ if(auth.currentUser)return auth.currentUser; if(!authReady){ authReady=new Promise(resolve=>{ const unsub=onAuthStateChanged(auth,u=>{unsub();resolve(u)}); }); } let u=await authReady; if(!u){ const r=await signInAnonymously(auth); u=r.user; } return u; }
let roomId=null,playerId=sessionStorage.getItem("mahjong4PlayerId")||("p_"+crypto.randomUUID()),playerName="",roomData=null,myIndex=-1,selected=-1,myTicketId=null,viewMode="player",startCallBusy=false,isAdmin=false; sessionStorage.setItem("mahjong4PlayerId",playerId); localStorage.setItem("mahjong4PlayerId",playerId);
const suits=["萬","筒","條"], emojis=["🀇","🀈","🀉","🀊","🀋","🀌","🀍","🀎","🀏"];
const winds=["東","南","西","北"], dragons=["中","發","白"];
function tileName(id){if(id<27){let s=Math.floor(id/9),n=id%9+1;return n+suits[s]}if(id<31)return winds[id-27];return dragons[id-31]}
function makeDeck(){let d=[];for(let i=0;i<34;i++)for(let j=0;j<4;j++)d.push(i);return d.sort(()=>Math.random()-.5)}
function el(id){return document.getElementById(id)}
window.admin=()=>{el("adminBox").classList.toggle("hidden");if(!el("prizes").children.length)addPrize()};
window.addPrize=(d={name:"獎項",count:1,image:""})=>{
 const row=document.createElement("div");row.className="prize-row";row.dataset.image=d.image||"";
 row.innerHTML='<input class="input pn" value="'+(d.name||"")+'" placeholder="獎項名稱"><input class="input pc" type="number" min="1" value="'+(d.count||1)+'"><label><img class="preview" src="'+(d.image||"")+'"><input type="file" accept="image/*" style="display:none"></label><button class="danger">×</button>';
 row.querySelector("input[type=file]").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{row.dataset.image=r.result;row.querySelector("img").src=r.result};r.readAsDataURL(f)};
 row.querySelector("button").onclick=()=>row.remove();el("prizes").appendChild(row)
};
function parsePrizes(){return [...document.querySelectorAll(".prize-row")].map(r=>({name:r.querySelector(".pn").value.trim(),count:+r.querySelector(".pc").value||0,image:r.dataset.image||""})).filter(x=>x.name&&x.count>0)}
function buildTickets(prizes,n){let a=[];prizes.forEach((p,i)=>{for(let j=0;j<p.count;j++)a.push({prize:p.name,prizeIndex:i,isWinner:true})});while(a.length<n)a.push({prize:"沒中",prizeIndex:null,isWinner:false});return a.slice(0,n).sort(()=>Math.random()-.5).map((x,i)=>({id:"t"+i+"_"+Math.random().toString(36).slice(2,7),...x,claimed:false}))}
window.createRoom=async()=>{
 try{await ensureAuth();}catch(e){return alert("Firebase 登入失敗："+(e.code||e.message)+"\n請到 Firebase Console → Authentication → Sign-in method 開啟「匿名 Anonymous」。");}
 if(el("pwd").value!=="17696969")return alert("管理員密碼錯誤");
 let n=Math.max(1,+el("ticketCount").value||30),pr=parsePrizes(),sum=pr.reduce((a,b)=>a+b.count,0);if(sum>n)return alert("獎項張數超過刮刮樂總張數");
 roomId=String(Math.floor(100000+Math.random()*900000));let tickets=buildTickets(pr,n);
 await set(ref(db,"rooms_v4/"+roomId),{type:"mahjong4",status:"waiting",players:{},turn:0,wall:[],hands:{},melds:{},discards:[],round:0,scratchPrizes:pr,scratchTickets:tickets,logs:["房間建立，等待四名玩家加入。"]});
 el("roomInfo").classList.remove("hidden");
 el("roomNo").textContent=roomId;
 el("joinLink").value=makeJoinLink(roomId);
 isAdmin=true;
 viewMode="admin";
 el("game").classList.add("hidden");
 el("setup").classList.remove("hidden");
 el("adminGameBar").classList.add("hidden");
 el("adminBox").classList.add("hidden");
 await watchRoomData();
 el("adminRoomStatus").textContent="目前 0 / 4 人，等待玩家加入";
 alert("房間建立完成！\n請按「複製連結」傳給其他玩家。\n管理員留在此頁，不會自動跳到賽局。");
};
function makeJoinLink(room){
 const u=new URL(window.location.href);
 u.search="";
 u.hash="";
 u.searchParams.set("room",String(room));
 return u.href;
}
async function copyText(text){
 try{
   if(navigator.clipboard && window.isSecureContext){
     await navigator.clipboard.writeText(text);
   }else{
     const ta=document.createElement("textarea");
     ta.value=text;document.body.appendChild(ta);ta.select();
     document.execCommand("copy");ta.remove();
   }
   return true;
 }catch(e){return false}
}
el("joinBtn")?.addEventListener("click",()=>window.join());
window.copyLink=async()=>{
 const ok=await copyText(makeJoinLink(roomId));
 alert(ok?"玩家加入連結已複製！\n直接貼給其他玩家即可。":"無法自動複製，請手動複製畫面上的加入連結。");
};
window.copyRoom=async()=>{
 const ok=await copyText(roomId);
 alert(ok?"房號已複製！":"請手動複製房號："+roomId);
};
window.join=async()=>{
 const status=el("joinStatus");
 const setStatus=(t,err=false)=>{
   if(status){
     status.textContent=t;
     status.style.color=err?"#b91c1c":"#475569";
   }
 };

 try{
   setStatus("正在連線 Firebase…");
   await ensureAuth();
 }catch(e){
   console.error("auth error",e);
   setStatus("❌ Firebase 登入失敗："+(e.code||e.message),true);
   return alert("Firebase 登入失敗："+(e.code||e.message)+
     "\n\n請到 Firebase Console → Authentication → Sign-in method → 開啟 Anonymous（匿名登入）。");
 }

 playerName=el("name").value.trim();
 roomId=el("joinRoom").value.trim()||new URLSearchParams(location.search).get("room");

 if(!playerName){
   setStatus("❌ 請先輸入暱稱。",true);
   return alert("請輸入暱稱");
 }
 if(!roomId){
   setStatus("❌ 沒有房號。",true);
   return alert("請輸入房號");
 }

 roomId=String(roomId).trim();
 setStatus("正在檢查房間 "+roomId+"…");

 try{
   const roomRef=ref(db,"rooms_v4/"+roomId);
   const s=await get(roomRef);

   if(!s.exists()){
     setStatus("❌ 找不到房間："+roomId,true);
     return alert("找不到房間："+roomId);
   }

   const d=s.val()||{};
   if(d.status==="ended"){
     setStatus("❌ 這個房間已結束。",true);
     return alert("這個房間的遊戲已結束，請使用管理員剛建立的新房間連結。");
   }

   const players=d.players||{};

   if(players[playerId]){
     setStatus("已經在房間內，正在載入牌局…");
     isAdmin=false;
     viewMode="player";
     await subscribe();
     return;
   }

   if(d.status!=="waiting"){
     setStatus("❌ 房間目前狀態："+d.status,true);
     return alert("這個房間目前狀態是「"+d.status+"」，無法加入。");
   }

   const count=Object.keys(players).length;
   if(count>=4){
     setStatus("❌ 房間已滿 4 人。",true);
     return alert("加入失敗：房間已滿 4 人。");
   }

   setStatus("正在加入房間…（"+count+" / 4）");

   const playersRef=ref(db,"rooms_v4/"+roomId+"/players");
   const tx=await runTransaction(playersRef,current=>{
     const now=current||{};
     if(now[playerId])return now;
     if(Object.keys(now).length>=4)return;
     const used=Object.values(now).map(p=>Number(p?.index));
     const idx=[0,1,2,3].find(i=>!used.includes(i));
     if(idx===undefined)return;
     return {
       ...now,
       [playerId]:{
         name:playerName,index:idx,status:"waiting",wins:0,ticketCount:0
       }
     };
   });

   if(!tx.committed){
     const check=await get(roomRef);
     const cd=check.exists()?check.val():null;
     if(!cd){
       setStatus("❌ 房間不存在。",true);
       return alert("加入失敗：房間不存在。");
     }
     const finalCount=Object.keys(cd.players||{}).length;
     if(finalCount>=4){
       setStatus("❌ 房間已滿 4 人。",true);
       return alert("加入失敗：房間已滿 4 人。");
     }
     if(cd.status!=="waiting"){
       setStatus("❌ 遊戲已開始，無法加入。",true);
       return alert("加入失敗：遊戲已經開始，無法中途加入。");
     }
     setStatus("❌ Firebase 拒絕寫入玩家資料。",true);
     return alert("加入失敗：Firebase 拒絕寫入玩家資料。\n\n請確認 Realtime Database 的 rooms_v4 規則允許玩家寫入。");
   }

   setStatus("✅ 加入成功！正在進入房間…");
   isAdmin=false;
   viewMode="player";
   await subscribe();

 }catch(e){
   console.error("join error",e);
   setStatus("❌ 加入失敗："+(e.code||"")+" "+(e.message||e),true);
   alert("加入房間發生錯誤：\n"+(e.code||"")+" "+(e.message||e));
 }
};

async function watchRoomData(){
 if(!roomId)return;
 setDebugStatus("正在連線房間…","");
 onValue(ref(db,"rooms_v4/"+roomId),async snap=>{
   roomData=snap.val();
   if(!roomData){
     setDebugStatus("❌ 找不到房間資料","房號："+roomId);
     if(el("adminRoomStatus"))el("adminRoomStatus").textContent="找不到房間";
     return;
   }

   const count=Object.keys(roomData.players||{}).length;
   updateDebugPanel(roomData);
   if(el("adminRoomStatus"))
     el("adminRoomStatus").textContent=
       roomData.status==="playing" ? "目前 4 / 4 人，遊戲進行中" :
       "目前 "+count+" / 4 人，"+(count===4?"四人已滿，準備開局":"等待玩家加入");

   if(el("game") && !el("game").classList.contains("hidden")) render();
   updateAdminToolbar();

   if(count!==4){
     setDebugStatus("等待其他玩家加入…","");
     return;
   }

   if(roomData.status==="playing"){
     setDebugStatus("🟢 遊戲已開始","");
     return;
   }

   // 只有管理員負責自動開局，玩家端只同步結果。
   if(viewMode!=="admin") {
     setDebugStatus("👥 4 人已滿，等待管理員開局…","");
     return;
   }

   if(roomData.status==="waiting" && !startCallBusy){
     startCallBusy=true;
     try{ await tryStartGame(); }
     catch(e){
       console.error(e);
       setDebugStatus("❌ 開局函式發生錯誤",e?.message||String(e));
     }
     finally{ startCallBusy=false; }
   }else if(roomData.status==="starting"){
     setDebugStatus("🎴 正在發牌…","");
   }
 });
}

async function subscribe(){
 viewMode="player";
 await watchRoomData();
}

window.watchGame=async()=>{
 if(!roomId)return;
 viewMode="admin";
 el("setup").classList.add("hidden");
 el("game").classList.remove("hidden");
 el("adminGameBar").classList.remove("hidden");
 updateAdminToolbar();
 if(roomData)render();
};

window.backToRoomManager=()=>{
 el("game").classList.add("hidden");
 el("setup").classList.remove("hidden");
 el("adminGameBar").classList.add("hidden");
 viewMode="admin"; updateAdminToolbar();
};

function setDebugStatus(startText, errorText=""){
  const a=el("debugStartStatus"), b=el("debugError");
  if(a)a.textContent=startText;
  if(b)b.textContent=errorText;
}
function updateDebugPanel(room){
  const players=room?.players||{};
  const count=Object.keys(players).length;
  if(el("debugPlayerCount"))el("debugPlayerCount").textContent=count+" / 4";
  if(el("debugRoomStatus"))el("debugRoomStatus").textContent=room?.status||"unknown";
  return count;
}

async function tryStartGame(){
 if(viewMode!=="admin")return;
 const roomRef=ref(db,"rooms_v4/"+roomId);
 try{
   const snap=await get(roomRef);
   const room=snap.val();
   if(!room)return;
   const entries=Object.entries(room.players||{}).sort((a,b)=>Number(a[1].index)-Number(b[1].index));
   if(entries.length!==4)return;
   if(room.status==="playing")return;

   setDebugStatus("🎴 4 人已到齊，正在發牌…","");

   const lock=await runTransaction(ref(db,"rooms_v4/"+roomId+"/status"),v=>v==="waiting"?"starting":v);
   if(!lock.committed)return;

   const latest=(await get(roomRef)).val();
   const latestEntries=Object.entries(latest?.players||{}).sort((a,b)=>Number(a[1].index)-Number(b[1].index));
   if(latestEntries.length!==4){
     await set(ref(db,"rooms_v4/"+roomId+"/status"),"waiting");
     return;
   }

   const deck=makeDeck(), hands={};
   latestEntries.forEach(([id],i)=>{ hands[id]=deck.splice(0,i===0?14:13); });

   await update(roomRef,{
     status:"playing", round:1, turn:0, wall:deck, hands, discards:[], melds:{},
     logs:[...(latest.logs||[]),"四位玩家已到齊，發牌完成，遊戲開始！"].slice(-80)
   });
   setDebugStatus("🟢 發牌完成！遊戲開始！","");
 }catch(e){
   console.error("tryStartGame error",e);
   try{await set(ref(db,"rooms_v4/"+roomId+"/status"),"waiting");}catch(_){}
   setDebugStatus("❌ 發牌失敗",(e?.code||"")+" "+(e?.message||e));
   alert("4 人已到齊，但發牌失敗：\n"+(e?.code||"")+" "+(e?.message||e));
 }
}

async function copyRoomNumber(){

  }catch(e){

async function restartGame(){
  if(viewMode!=="admin")return;

  const ok=confirm(
    "確定要結束目前這一局並重新開局嗎？\n\n"+
    "四位玩家會留在房間內，不需要重新加入。\n"+
    "目前這一局的手牌、牌牆與出牌紀錄會清除。"
  );
  if(!ok)return;

  try{
    const roomRef=ref(db,"rooms_v4/"+roomId);
    const snap=await get(roomRef);
    const room=snap.val()||{};
    const players=room.players||{};
    const count=Object.keys(players).length;

    if(count!==4){
      alert("目前房間只有 "+count+" / 4 人，無法重新開局。\n請先讓 4 位玩家都留在房間內。");
      return;
    }

    await update(roomRef,{
      status:"waiting",
      round:1,
      turn:0,
      wall:[],
      hands:{},
      discards:[],
      melds:{},
      logs:[...(room.logs||[]),"管理員結束本局，準備重新開局。"].slice(-80)
    });

    setDebugStatus("🔄 本局已結束，等待重新發牌…","");
    alert("本局已結束。\n四位玩家會留在房間，4 人仍滿員時將自動重新發牌。");
  }catch(e){
    console.error(e);
    alert("重新開局失敗："+(e?.code||"")+" "+(e?.message||e));
  }
}

 el("setup").classList.add("hidden");

 el("gameRoom").textContent=roomId;

 const ps=Object.entries(roomData.players||{})
   .sort((a,b)=>Number(a[1].index)-Number(b[1].index));
 myIndex=ps.findIndex(x=>x[0]===playerId);

 const seat={};
 ps.forEach(([id,p])=>seat[p.index]={id,p});

 // 固定顯示 4 個座位，不會再出現「只有 3 格」的情況。

 if(el("roomDebug")){

   roomData.status==="starting" ? "🎴 正在發牌…" :

 if(el("startDebug")){
   el("startDebug").textContent=
     roomData.status==="playing" ? "🟢 發牌完成，遊戲已開始" :
     roomData.status==="starting" ? "🎴 正在準備牌局…" :
     count===4 ? "👥 4 / 4，準備開始發牌…" : "等待玩家加入…";
 }

 const turn=ps.find(x=>Number(x[1].index)===Number(roomData.turn));
 el("turnText").textContent=
   roomData.status==="starting" ? "正在發牌…" :

 el("roundText").textContent=

   ? "第 "+(roomData.round||1)+" 局　牌牆剩餘 "+(roomData.wall||[]).length+" 張"

function renderHand(){
 const isAdminView=(viewMode==="admin");
 const h=isAdminView ? [] : [...((roomData.hands||{})[playerId]||[])].sort((a,b)=>a-b);

 const isTurn=
   !isAdminView &&
   roomData.status==="playing" &&
   roomData.players?.[playerId]?.index===roomData.turn;

 if(isAdminView){
   el("myHand").innerHTML=
     roomData.status==="playing"
       ? '<span style="color:#fff;font-weight:800">管理員觀看模式：不顯示玩家手牌</span>'
       : '<span style="color:#fff;font-weight:800">等待四人到齊並發牌…</span>';
   el("actions").innerHTML="";
   return;
 }

 el("myHand").innerHTML=h.length
   ? h.map((t,i)=>'<div class="tile '+(selected===i?"selected":"")+
       '" onclick="pick('+i+')">'+tileName(t)+'</div>').join("")
   : '<span style="color:#fff;font-weight:800">等待四人到齊並發牌…</span>';

 let a="";
 if(isTurn){
   if(h.length===14 && canHu(h))
     a+='<button class="success" onclick="hu()">🀄 胡牌</button>';
   if(h.length===14)
     a+='<button class="danger" onclick="discard()">出牌</button>';
 }else if(roomData.status==="playing"){
   a='<span>等待你的回合…</span>';
 }else{
   a='<span>等待四人到齊…</span>';
 }
 el("actions").innerHTML=a;
}

function renderDiscards(){el("discards").innerHTML=(roomData.discards||[]).map(t=>'<div class="tile smalltile">'+tileName(t)+'</div>').join("")}
function renderLog(){el("log").innerHTML=(roomData.logs||[]).slice().reverse().map(x=>"<div>"+esc(x)+"</div>").join("")}
function renderLB(){let ps=Object.values(roomData.players||{}).sort((a,b)=>(b.wins||0)-(a.wins||0));el("leaderboard").innerHTML="<table><tr><th>玩家</th><th>胡牌</th><th>刮刮樂</th><th>獎項</th></tr>"+ps.map(p=>"<tr><td>"+esc(p.name)+"</td><td>"+(p.wins||0)+"</td><td>"+(p.ticketCount||0)+"</td><td>"+esc(p.prize||"—")+"</td></tr>").join("")+"</table>"}
function canHu(h){if(h.length!==14)return false;let a=[...h].sort((x,y)=>x-y);for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){let r=a.slice(0,i).concat(a.slice(i+2));if(meldable(r))return true}}return false}
function meldable(a){if(!a.length)return true;let x=a[0];let same=a.filter(v=>v===x).length;if(same>=3&&meldable(removeN(a,x,3)))return true;if(x<27&&x%9<=6&&a.includes(x+1)&&a.includes(x+2)){let r=removeOne(removeOne(removeOne(a,x),x+1),x+2);if(meldable(r))return true}return false}
function removeOne(a,x){let i=a.indexOf(x);return i<0?a:a.slice(0,i).concat(a.slice(i+1))}
function removeN(a,x,n){let r=[...a];for(let i=0;i<n;i++)r.splice(r.indexOf(x),1);return r}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
