    });

    function goToLobby() {
      window.location.href = 'https://sile9999.github.io/all-in-one-games/';
    }

    function showExpiredScreen() {
      document.getElementById('main-setup-view').classList.add('hidden');
      document.getElementById('player-game-view').classList.add('hidden');
      document.getElementById('join-modal').classList.add('hidden');
      document.getElementById('expired-view').classList.remove('hidden');
    }

    function setupOptionGroup(groupId, callback) {
      const group = document.getElementById(groupId);
      group.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-option')) {
          Array.from(group.children).forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          callback(e.target.dataset.val || e.target.dataset.mode);
        }
      });
    }

    function openAdminModal() {
      document.getElementById('pwd-modal').classList.remove('hidden');
    }

    function checkPassword() {
      const pwd = document.getElementById('admin-pwd').value;
      if (pwd === '17696969') {
        document.getElementById('pwd-modal').classList.add('hidden');
        document.getElementById('setting-fields').classList.remove('disabled-area');
        document.getElementById('admin-unlock-btn').classList.add('hidden');
        
        document.getElementById('create-room-btn').classList.remove('hidden');
        document.getElementById('sim-join-btn').classList.remove('hidden');
      } else {
        alert('密碼錯誤！');
      }
    }

    function createRoom() {
      const noteText = document.getElementById('admin-note-input').value.trim();
      const endTimeVal = document.getElementById('admin-endtime-input').value;

      let endTimeStamp = null;
      if (endTimeVal) {
        endTimeStamp = new Date(endTimeVal).getTime();
      }

      roomId = Math.floor(100000 + Math.random() * 900000).toString();
      roomRef = ref(db, 'rooms_v4/' + roomId);

      if (totalTiles % 2 !== 0) totalTiles -= 1;

      set(roomRef, {
        totalTiles: totalTiles,
        note: noteText,
        endTime: endTimeStamp,
        players: {}
      });

      document.getElementById('room-num-display').innerText = roomId;
      document.getElementById('admin-action-area').classList.remove('hidden');

      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        currentPlayers = data.players || {};
        renderLeaderboard('admin-leaderboard-list', currentPlayers);
      });
    }

    function copyRoomLink(btn) {
      if (!roomId) return;
      const baseUrl = window.location.origin + window.location.pathname;
      const fullLink = `${baseUrl}?room=${roomId}`;
      const noteText = document.getElementById('admin-note-input').value.trim() || '無';
      const endTimeVal = document.getElementById('admin-endtime-input').value;
      const endTimeText = endTimeVal ? endTimeVal.replace('T', ' ') : '無限制';

      let copyMsg = `📜 唐詩對對碰挑戰房\n`;
      copyMsg += `🔗 遊戲連結：${fullLink}\n`;
      copyMsg += `⏱️ 競賽模式：完成耗時比拼\n`;
      copyMsg += `⏳ 結束時間：${endTimeText}\n`;
      copyMsg += `💡 說明：點擊連結進入後即可開始唐詩對句挑戰！\n`;
      copyMsg += `📝 備註：${noteText}\n`;

      navigator.clipboard.writeText(copyMsg).then(() => {
        triggerButtonFeedback(btn, '✅ 已複製房間連結！', '📋 複製房號與連結');
      }).catch(() => {});
    }

    function copyScores(btn) {
      if (!currentPlayers || Object.keys(currentPlayers).length === 0) return;
      
      const sorted = Object.values(currentPlayers).sort((a, b) => {
        if (a.status === 'ended' && b.status !== 'ended') return -1;
        if (a.status !== 'ended' && b.status === 'ended') return 1;
        return (a.timeUsedMs || Infinity) - (b.timeUsedMs || Infinity);
      });

      let text = `🏆【 唐詩對對碰排行榜】\n📍 房號：${roomId || '無'}\n-------------------\n`;
      sorted.forEach((p, idx) => { 
        const timeStr = p.timeUsedMs ? `${(p.timeUsedMs / 1000).toFixed(3)} 秒` : '進行中/未完成';
        text += `第 ${idx + 1} 名: ${p.name} - 耗時: ${timeStr}\n`; 
      });

      navigator.clipboard.writeText(text).then(() => {
        triggerButtonFeedback(btn, '✅ 已複製戰報成績！', '🏆 複製戰報成績');
      }).catch(() => {});
    }

    function triggerButtonFeedback(btnElement, activeText, originalText) {
      if (!btnElement) return;
      btnElement.innerText = activeText;
      btnElement.classList.add('btn-success-state');
      setTimeout(() => {
        btnElement.innerText = originalText;
        btnElement.classList.remove('btn-success-state');
      }, 1200);
    }

    function openJoinModalNewTab() {
      const baseUrl = window.location.origin + window.location.pathname;
      const targetUrl = roomId ? `${baseUrl}?room=${roomId}` : baseUrl;
      window.open(targetUrl, '_blank');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function joinRoomGame() {
      const inputRoom = document.getElementById('input-room-id').value.trim();
      const inputName = document.getElementById('input-player-name').value.trim();

      if (!inputRoom) return alert('請輸入房號！');
      if (!inputName) return alert('請輸入暱稱！');

      roomId = inputRoom;
      playerName = inputName;
      roomRef = ref(db, 'rooms_v4/' + roomId);

      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return alert('找不到該房間，請確認房號是否正確！');

        if (data.endTime && Date.now() > data.endTime) {
          showExpiredScreen();
          return;
        }

        roomSettings.totalTiles = data.totalTiles || 24;
        totalTiles = roomSettings.totalTiles;

        const pairCount = totalTiles / 2;
        
        // 1. 取得所有不重複的詩句配對 ID
        const uniquePairIds = [...new Set(poemPool.map(item => item.pairId))];
        // 2. 隨機打亂並選出 pairCount 個 ID
        const selectedPairIds = uniquePairIds.sort(() => Math.random() - 0.5).slice(0, pairCount);

        // 3. 取出選定 ID 的完整上下句
        let selectedPoemCards = poemPool.filter(item => selectedPairIds.includes(item.pairId));
        // 4. 洗牌
        selectedPoemCards.sort(() => Math.random() - 0.5);

        gridTiles = selectedPoemCards;
        matchedTiles = [];
        timeUsedMs = null;
        selectedIndices = [];
        isGameActive = true;

        update(ref(db, `rooms_v4/${roomId}/players/${playerId}`), { 
          name: playerName, 
          timeUsedMs: null,
          status: 'playing'
        });

        document.getElementById('join-modal').classList.add('hidden');
        document.getElementById('main-setup-view').classList.add('hidden');
        document.getElementById('player-game-view').classList.remove('hidden');

        startTime = Date.now();
        renderGrid();
        startPersonalTimer();
        listenLeaderboard();

      }, { onlyOnce: true });
    }

    function startPersonalTimer() {
      if (timer) clearInterval(timer);
      
      timer = setInterval(() => {
        if (!isGameActive) return;
        const now = Date.now();
        const elapsed = ((now - startTime) / 1000).toFixed(1);
        document.getElementById('time-display').innerText = elapsed + 's';
      }, 100);
    }

    function listenLeaderboard() {
      onValue(ref(db, `rooms_v4/${roomId}/players`), (snapshot) => {
        const playersData = snapshot.val() || {};
        currentPlayers = playersData;
        renderLeaderboard('player-leaderboard-list', playersData);
      });
    }

    function renderGrid() {
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';

      if (totalTiles <= 24) {
        gridEl.className = 'grid grid-24';
      } else {
        gridEl.className = 'grid grid-large';
      }

      let cols = 6;
      if (totalTiles <= 48) cols = 6;
      else cols = 8;

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      gridTiles.forEach((tileObj, idx) => {
        const tile = document.createElement('div');
        const isMatched = matchedTiles.includes(idx);
        const isSelected = selectedIndices.includes(idx);

        let tileClass = 'tile';
        const isRevealed = isMatched || isSelected;

        if (isRevealed) {
          tileClass += ' selected';
          tile.className = tileClass;
          tile.innerHTML = `<span class="tile-text">${tileObj.text}</span>`;
        } else {
          tile.className = tileClass;
          tile.innerText = '📜';
        }

        if (!isMatched && !isCheckingPair && isGameActive) {
          tile.onclick = () => handleTileClick(idx);
        }

        gridEl.appendChild(tile);
      });
    }

    function handleTileClick(index) {
      if (!isGameActive || isCheckingPair) return;
      if (selectedIndices.includes(index) || matchedTiles.includes(index)) return;

      selectedIndices.push(index);
      renderGrid();

      if (selectedIndices.length === 2) {
        const [firstIdx, secondIdx] = selectedIndices;
        
        // 核心邏輯修改：比對兩張牌的 pairId 是否相同（即上下句相匹配）
        if (gridTiles[firstIdx].pairId === gridTiles[secondIdx].pairId) {
          matchedTiles.push(firstIdx, secondIdx);
          selectedIndices = [];
          renderGrid();

          if (matchedTiles.length === gridTiles.length) {
            const finishTime = Date.now();
            timeUsedMs = finishTime - startTime;

            if (timer) clearInterval(timer);
            isGameActive = false;
            
            const secondsFormatted = (timeUsedMs / 1000).toFixed(3);
            document.getElementById('final-time-text').innerText = `完成總耗時：${secondsFormatted} 秒`;
            document.getElementById('game-over-mask').classList.remove('hidden');

            update(ref(db, `rooms_v4/${roomId}/players/${playerId}`), { 
              timeUsedMs: timeUsedMs,
              status: 'ended'
            });
          }
        } else {
          isCheckingPair = true;
          const tiles = document.querySelectorAll('.tile');
          tiles[firstIdx]?.classList.add('error');
          tiles[secondIdx]?.classList.add('error');

          setTimeout(() => {
            selectedIndices = [];
            isCheckingPair = false;
            renderGrid();
          }, 800);
        }
      }
    }

    function renderLeaderboard(elementId, players) {
      const lbEl = document.getElementById(elementId);
      if (!lbEl) return;
      
      const sorted = Object.entries(players)
        .map(([id, p]) => ({ id, ...p }))
        .sort((a, b) => {
          if (a.status === 'ended' && b.status !== 'ended') return -1;
          if (a.status !== 'ended' && b.status === 'ended') return 1;
          return (a.timeUsedMs || Infinity) - (b.timeUsedMs || Infinity);
        });

      lbEl.innerHTML = sorted.map((p, idx) => {
        let timeDisplay = '挑戰中...';
        if (p.timeUsedMs) {
          const secondsFormatted = (p.timeUsedMs / 1000).toFixed(3);
          timeDisplay = `<span style="color:#059669;">⏱️ ${secondsFormatted}秒</span>`;
        }

        return `
          <div class="leaderboard-item ${p.id === playerId ? 'me' : ''}">
            <span>#${idx + 1} ${p.name} ${p.id === playerId ? '(你)' : ''}</span>
            <span>${timeDisplay} ${p.status === 'ended' ? '(已完成)' : ''}</span>
          </div>
        `;
      }).join('') || '<div style="color:#94a3b8; font-size:13px;">尚無玩家資料...</div>';
    }

    function initSecurity() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }
  </script>
</head>
<body>

<div id="pwd-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3 style="margin-bottom:12px; color:#1e293b;">管理者身分驗證</h3>
    <input type="password" id="admin-pwd" class="input-box" placeholder="請輸入管理者密碼">
    <button class="btn-primary" onclick="checkPassword()">確認驗證</button>
    <button class="btn-primary btn-admin" style="margin-top:8px;" onclick="closeModal('pwd-modal')">取消</button>
  </div>
</div>

<div id="join-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3 style="margin-bottom:16px; color:#1e293b;">進入挑戰房間</h3>
    <input type="text" id="input-room-id" class="input-box" placeholder="輸入 6 位數房號" maxlength="6">
    <input type="text" id="input-player-name" class="input-box" placeholder="輸入你的暱稱" maxlength="10">
    <button class="btn-primary" onclick="joinRoomGame()">開始個人挑戰</button>
  </div>
</div>

<div id="main-setup-view" class="container">
  <button class="btn-lobby" onclick="goToLobby()">🏠 回到遊戲大廳</button>

  <h1>📜 唐詩對對碰 </h1>

  <div id="setting-fields" class="disabled-area">
    <div class="menu-group">
      <label>盤面卡牌總數：</label>
      <div class="btn-group" id="grid-options">
        <button class="btn-option active" data-val="24">24格</button>
        <button class="btn-option" data-val="36">36格</button>
        <button class="btn-option" data-val="48">48格</button>
        <button class="btn-option" data-val="60">60格</button>
        <button class="btn-option" data-val="72">72格</button>
        <button class="btn-option" data-val="84">84格</button>
        <button class="btn-option" data-val="96">96格</button>
      </div>
    </div>

    <div class="menu-group">
      <label>設定結束時間 (選填)：</label>
      <input type="datetime-local" id="admin-endtime-input" class="input-box">
    </div>

    <div class="menu-group">
      <label>房間備註說明 (選填)：</label>
      <input type="text" id="admin-note-input" class="input-box" placeholder="例：三年一班唐詩對句大賽" maxlength="30">
    </div>
  </div>

  <button id="admin-unlock-btn" class="btn-primary btn-admin" onclick="openAdminModal()">🔑 解鎖管理者設定</button>
  <button id="create-room-btn" class="btn-primary hidden" onclick="createRoom()">建立房間</button>
  <button id="sim-join-btn" class="btn-primary btn-start hidden" style="margin-top:10px;" onclick="openJoinModalNewTab()">🎮 房號加入 </button>

  <div id="admin-action-area" class="hidden">
    <div class="room-display-box">
      <div style="font-size:13px; color:#64748b; font-weight:bold;">當前房間號碼</div>
      <div class="room-number" id="room-num-display">------</div>
    </div>

    <button class="btn-primary btn-copy" onclick="copyRoomLink(this)">📋 複製房號與連結</button>
    <button class="btn-primary btn-copy" onclick="copyScores(this)">🏆 複製總排行榜成績</button>

    <div class="leaderboard">
      <div class="leaderboard-title">📊 排行榜 (即時更新)</div>
      <div id="admin-leaderboard-list"></div>
    </div>
  </div>
</div>

<div id="player-game-view" class="container hidden">

  <div class="status-bar">
    <div id="room-tag-display" style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">個人挑戰中</div>
    <div>已用時間: <span id="time-display">0.0s</span></div>
  </div>

  <div class="grid-container">
    <div class="grid" id="grid"></div>
    <div id="game-over-mask" class="game-over-overlay hidden">
      <div>🎉 恭喜完成挑戰！</div>
      <div id="final-time-text" style="font-size:16px; margin-top:8px; color:#fde047;">完成總耗時：-- 秒</div>
      <div style="font-size:14px; margin-top:8px; font-weight:normal;">請查看下方總排行榜了解名次</div>
    </div>
  </div>

  <div class="leaderboard">
    <div class="leaderboard-title">🏆 排行榜</div>
    <div id="player-leaderboard-list"></div>
  </div>
</div>

<div id="expired-view" class="expired-card hidden">
  <div class="expired-icon">⌛</div>
  <div class="expired-title">本次活動已結束</div>
  <div class="expired-desc">感謝您的關注！本房間的挑戰時間已過，目前已不再開放進入。</div>
  <br>
  <button class="btn-lobby" style="margin-bottom:0;" onclick="goToLobby()">🏠 回到遊戲大廳</button>
</div>

</body>
</html>
