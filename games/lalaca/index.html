      background-position: center;

      align-items: center; 
      min-height: 100vh; 
      padding: 16px;

    .btn-lobby {

      width: auto;
      min-width: 180px;
      padding: 10px 20px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin: 0 auto 16px auto;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-lobby:hover { background-color: #0369a1; }

    .menu-group { margin-bottom: 16px; text-align: left; }
    .menu-group label { display: block; font-weight: bold; color: #34495e; margin-bottom: 8px; font-size: 14px; }
    
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-option { flex: 1; min-width: 60px; padding: 8px 4px; border: 2px solid #cbd5e1; border-radius: 8px; background: white; cursor: pointer; font-weight: bold; color: #475569; text-align: center; font-size: 12px; }
    .btn-option.active { border-color: #3b82f6; background-color: #eff6ff; color: #1d4ed8; }
    
    .input-box { width: 100%; padding: 10px 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 15px; font-weight: bold; outline: none; margin-bottom: 10px; }
    
    .btn-primary { width: 100%; padding: 12px; background-color: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px; transition: all 0.2s ease; }
    .btn-primary:hover { background-color: #2563eb; }
    .btn-admin { background-color: #64748b; }
    .btn-admin:hover { background-color: #475569; }
    .btn-copy { background-color: #8b5cf6; }
    .btn-copy:hover { background-color: #7c3aed; }
    .btn-start { background-color: #10b981; }
    .btn-start:hover { background-color: #059669; }

    .btn-success-state { background-color: #059669 !important; transform: scale(0.98); }

    .room-display-box { background: #f1f5f9; border: 2px dashed #94a3b8; border-radius: 8px; padding: 12px; text-align: center; margin-top: 12px; }
    .room-number { font-size: 28px; font-weight: bold; color: #2563eb; letter-spacing: 2px; }

    .status-bar { display: flex; justify-content: space-between; background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-weight: bold; color: #334155; }
    .grid-container { position: relative; margin-bottom: 16px; }
    
    .grid { display: grid; gap: 8px; }

    .tile { aspect-ratio: 1; background-color: #81e6d9; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; color: #1e293b; cursor: pointer; transition: transform 0.1s, background-color 0.2s; position: relative; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .tile:hover { transform: scale(1.04); }
    
    .tile.selected { background-color: #ffffff; border: 3px solid #fde047; transform: scale(0.95); }
    .tile.error { background-color: #fca5a5; animation: shake 0.3s; }
    .tile.covered-done { background-color: #94a3b8; color: #64748b; opacity: 0.7; cursor: not-allowed; }
    
    /* 詩句字體適性調整 */
    .tile-text { 
      font-size: 15px; 
      font-weight: bold; 
      color: #1e293b; 
      text-align: center; 
      line-height: 1.25; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      width: 100%; 
      height: 100%; 
      padding: 4px;
      word-break: break-all;
    }

    /* 手機螢幕適應 */
    @media (max-width: 600px) {
      .grid, .grid.grid-24 { 
        grid-template-columns: repeat(4, 1fr) !important; 
        gap: 8px !important; 
      }

      .grid.grid-large { 
        grid-template-columns: repeat(6, 1fr) !important; 
        gap: 4px !important; 
      }

      .tile { 
        font-size: 24px; 
        border-radius: 8px; 
      }
      
      .tile-text {
        font-size: 11px;
        padding: 2px;
      }
    }

    .game-over-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold; z-index: 10; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }

    .prize-image-preview {

      height: 40px;
      object-fit: contain;
      border-radius: 6px;

      background: white;
      flex: 0 0 40px;

      font-size: 18px;

      color: #475569;

    .leaderboard-prize {

    function joinRoomGame() {
      const inputRoom = document.getElementById('input-room-id').value.trim();
      const inputName = document.getElementById('input-player-name').value.trim();

      if (!inputRoom) return alert('請輸入房號！');
      if (!inputName) return alert('請輸入暱稱！');

      roomId = inputRoom;
      playerName = inputName;
      roomRef = ref(db, 'rooms_v4/' + roomId);

      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return alert('找不到該房間，請確認房號是否正確！');

        if (data.endTime && Date.now() > data.endTime) {
          showExpiredScreen();
          return;
        }

        const nicknameKey = nicknameToKey(inputName);
        if (data.usedNicknames && data.usedNicknames[nicknameKey]) {
          alert(`暱稱【${inputName}】已完成過本房間挑戰，不能重複遊玩！`);
          return;
        }
        const players = data.players || {};
        const duplicatePlaying = Object.values(players).some(p => nicknameToKey(p.name || '') === nicknameKey && p.status !== 'ended');
        if (duplicatePlaying) {
          alert(`暱稱【${inputName}】目前正在遊戲中，請使用其他暱稱！`);
          return;
        }

        roomSettings.totalTiles = data.totalTiles || 24;
        roomSettings.poemCategory = data.poemCategory || 'all';
        roomSettings.coverMode = data.coverMode || 'covered';
        roomSettings.scratchEnabled = data.scratchEnabled === true;
        roomSettings.scratchTicketCount = data.scratchTicketCount || 0;
        totalTiles = roomSettings.totalTiles;
        currentScratchTickets = data.scratchTickets || {};
        currentScratchPrizes = data.scratchPrizes || [];

        // 根據類型篩選「完整配對」
        // 不能先逐句篩選，否則某些上下句字數不同的詩句會只剩 1 張，
        // 造成例如設定 24 格卻實際只產生 23 格的問題。
        const pairMap = new Map();
        poemPool.forEach(item => {
          if (!pairMap.has(item.pairId)) pairMap.set(item.pairId, []);
          pairMap.get(item.pairId).push(item);
        });

        let validPairs = [...pairMap.values()].filter(pair => pair.length === 2);

        if (roomSettings.poemCategory === '5') {
          validPairs = validPairs.filter(pair => pair.every(item => item.text.length === 5));
        } else if (roomSettings.poemCategory === '7') {
          validPairs = validPairs.filter(pair => pair.every(item => item.text.length === 7));
        }

        const pairCount = totalTiles / 2;

        if (validPairs.length < pairCount) {
          return alert(`目前選取的分類題庫量不足（完整配對僅有 ${validPairs.length} 組），請減少卡牌數量或選擇不限分類！`);
        }

        // 隨機選出指定數量的「完整上下句配對」
        validPairs.sort(() => Math.random() - 0.5);
        const selectedPairs = validPairs.slice(0, pairCount);

        // 展開成卡牌並洗牌；因此一定會是 pairCount × 2 張
        let selectedPoemCards = selectedPairs.flat();
        selectedPoemCards.sort(() => Math.random() - 0.5);

        gridTiles = selectedPoemCards;

        // 防呆：若題庫資料異常導致卡牌數量不符，禁止開始不完整盤面
        if (gridTiles.length !== totalTiles) {
          return alert(`題庫產生卡牌數量異常（設定 ${totalTiles} 格，實際 ${gridTiles.length} 格），請重新建立房間或聯絡管理員。`);
        }
        matchedTiles = [];
        timeUsedMs = null;
        selectedIndices = [];
        isGameActive = true;

        update(ref(db, `rooms_v4/${roomId}/players/${playerId}`), { 
          name: playerName, 
          timeUsedMs: null,
          status: 'playing'
        });

        document.getElementById('join-modal').classList.add('hidden');
        document.getElementById('main-setup-view').classList.add('hidden');
        document.getElementById('player-game-view').classList.remove('hidden');

        startTime = Date.now();
        renderGrid();
        startPersonalTimer();
        listenLeaderboard();

      }, { onlyOnce: true });
    }

    function renderGrid() {
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';

      if (totalTiles <= 24) {
        gridEl.className = 'grid grid-24';
      } else {
        gridEl.className = 'grid grid-large';
      }

      let cols = 6;
      if (totalTiles <= 48) cols = 6;
      else cols = 8;

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      const isUncoveredMode = roomSettings.coverMode === 'open';

      gridTiles.forEach((tileObj, idx) => {
        const tile = document.createElement('div');
        const isMatched = matchedTiles.includes(idx);
        const isSelected = selectedIndices.includes(idx);

        let tileClass = 'tile';

        if (isUncoveredMode) {
          /* === 反向玩法：不蓋牌模式 === */
          if (isMatched) {
            // 成功配對後 -> 變成蓋牌 (並且鎖定無法點擊)
            tile.className = tileClass + ' covered-done';
            tile.innerText = '📜';
          } else if (isSelected) {
            // 選取中的牌 -> 黃色框強調
            tile.className = tileClass + ' selected';
            tile.innerHTML = `<span class="tile-text">${tileObj.text}</span>`;
          } else {
            // 未配對牌 -> 預設直接顯示文字
            tile.className = tileClass;
            tile.innerHTML = `<span class="tile-text">${tileObj.text}</span>`;
          }
        } else {
          /* === 正向玩法：傳統蓋牌模式 === */
          const isRevealed = isMatched || isSelected;

          if (isRevealed) {
            tileClass += ' selected';
            tile.className = tileClass;
            tile.innerHTML = `<span class="tile-text">${tileObj.text}</span>`;
          } else {
            tile.className = tileClass;
            tile.innerText = '📜';
          }
        }

        if (!isMatched && !isCheckingPair && isGameActive) {
          tile.onclick = () => handleTileClick(idx);
        }

        gridEl.appendChild(tile);
      });
    }

    function handleTileClick(index) {
      if (!isGameActive || isCheckingPair) return;
      if (selectedIndices.includes(index) || matchedTiles.includes(index)) return;

      selectedIndices.push(index);
      renderGrid();

      if (selectedIndices.length === 2) {
        const [firstIdx, secondIdx] = selectedIndices;
        
        // 比對兩張牌的 pairId 是否相同（即上下句相匹配）
        if (gridTiles[firstIdx].pairId === gridTiles[secondIdx].pairId) {
          matchedTiles.push(firstIdx, secondIdx);
          selectedIndices = [];
          renderGrid();

          if (matchedTiles.length === gridTiles.length) {
            const finishTime = Date.now();
            timeUsedMs = finishTime - startTime;

            if (timer) clearInterval(timer);
            isGameActive = false;
            
            const secondsFormatted = (timeUsedMs / 1000).toFixed(3);
            document.getElementById('final-time-text').innerText = `完成總耗時：${secondsFormatted} 秒`;

            if (roomSettings.scratchEnabled) {
              finishGameAndIssueScratch();
            } else {
              document.getElementById('game-over-mask').classList.remove('hidden');
              update(ref(db, `rooms_v4/${roomId}/players/${playerId}`), {
                timeUsedMs: timeUsedMs,
                status: 'ended'
              });
            }
          }
        } else {
          isCheckingPair = true;
          const tiles = document.querySelectorAll('.tile');
          tiles[firstIdx]?.classList.add('error');
          tiles[secondIdx]?.classList.add('error');

          setTimeout(() => {
            selectedIndices = [];
            isCheckingPair = false;
            renderGrid();
          }, 800);
        }
      }
    }

    function addScratchPrizeRow(data = {}) {
      const list = document.getElementById('scratch-prize-list');
      if (!list) return;

      const row = document.createElement('div');
      row.className = 'scratch-prize-row';
      row.dataset.image = data.image || '';

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.className = 'input-box prize-name-input';

      countInput.min = '1';
      countInput.max = '9999';
      countInput.value = data.count || 1;
      countInput.title = '獎項張數';

      const fileLabel = document.createElement('label');
      fileLabel.className = 'scratch-file-label';
      fileLabel.title = '上傳獎項圖片';

      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';

      const previewWrap = document.createElement('span');
      const fileText = document.createElement('span');
      fileText.textContent = data.image ? '已上傳' : '上傳圖片';

      const renderPreview = (src) => {
        previewWrap.innerHTML = '';
        if (src) {
          const img = document.createElement('img');
          img.className = 'prize-image-preview';
          img.src = src;
          previewWrap.appendChild(img);
        } else {
          const empty = document.createElement('span');
          empty.className = 'prize-image-empty';
          empty.textContent = '🖼️';
          previewWrap.appendChild(empty);
        }
      };
      renderPreview(data.image || '');

      fileLabel.appendChild(previewWrap);
      fileLabel.appendChild(fileText);
      fileLabel.appendChild(fileInput);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'scratch-remove-btn';
      removeBtn.textContent = '×';
      removeBtn.title = '刪除這個獎項';
      removeBtn.onclick = () => removeScratchPrizeRow(row);

      fileInput.onchange = async () => {
        const file = fileInput.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          alert('請選擇圖片檔案。');
          return;
        }
        try {
          const dataUrl = await compressPrizeImage(file);
          row.dataset.image = dataUrl;
          renderPreview(dataUrl);
          fileText.textContent = file.name.length > 12 ? file.name.slice(0, 10) + '…' : file.name;
        } catch (err) {
          console.error(err);
          alert('圖片處理失敗，請換一張圖片再試。');
        }
      };

      countInput.addEventListener('input', updateScratchTicketSummary);
      nameInput.addEventListener('input', updateScratchTicketSummary);

      row.appendChild(nameInput);
      row.appendChild(countInput);
      row.appendChild(fileLabel);
      row.appendChild(removeBtn);
      list.appendChild(row);
      updateScratchTicketSummary();
    }

    function removeScratchPrizeRow(row) {
      const list = document.getElementById('scratch-prize-list');
      if (!list || !row) return;
      row.remove();
      if (!list.children.length) addScratchPrizeRow();
      updateScratchTicketSummary();
    }

    function compressPrizeImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const maxSide = 600;
            const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.max(1, Math.round(img.naturalWidth * scale));
            const h = Math.max(1, Math.round(img.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/webp', 0.78));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function parseScratchPrizes() {
      const rows = [...document.querySelectorAll('#scratch-prize-list .scratch-prize-row')];
      return rows.map(row => {
        const name = row.querySelector('.prize-name-input')?.value.trim() || '';
        const count = parseInt(row.querySelector('.prize-count-input')?.value, 10) || 0;
        const image = row.dataset.image || '';
        return { name, count, image };
      }).filter(item => item.name && item.count > 0);
    }

    function buildScratchTickets(prizes, ticketCount) {
      const tickets = {};
      let n = 0;

      prizes.forEach(({ name, count }, prizeIndex) => {
        for (let i = 0; i < count; i++) {
          const id = `t${Date.now().toString(36)}_${n}_${Math.random().toString(36).slice(2,7)}`;
          tickets[id] = {
            prize: name,
            prizeIndex,
            isWinner: true,
            claimed: false,
            claimedBy: '',
            claimedAt: null
          };
          n++;
        }
      });

      while (n < ticketCount) {
        const id = `t${Date.now().toString(36)}_${n}_${Math.random().toString(36).slice(2,7)}`;
        tickets[id] = {
          prize: '沒中',
          prizeIndex: null,
          isWinner: false,
          claimed: false,
          claimedBy: '',
          claimedAt: null
        };
        n++;
      }

      return Object.fromEntries(Object.entries(tickets).sort(() => Math.random() - 0.5));
    }

    function updateScratchTicketSummary() {
      const countEl = document.getElementById('scratch-ticket-count');
      const summaryEl = document.getElementById('scratch-ticket-summary');
      if (!countEl || !summaryEl) return;

      const total = Math.max(1, parseInt(countEl.value, 10) || 1);
      const prizes = parseScratchPrizes();
      const winning = prizes.reduce((sum, item) => sum + item.count, 0);
      const noWin = Math.max(0, total - winning);

      summaryEl.innerHTML =
        `目前設定：<b>${total}</b> 張刮刮樂　｜　` +
        `獎項 <b>${winning}</b> 張　｜　` +
        `沒中 🐢 <b>${noWin}</b> 張` +
        (winning > total ? `<br><span style="color:#dc2626;font-weight:bold;">⚠️ 獎項數量超過總張數，無法建立房間。</span>` : '');
    }

    function getPlayerPrize(player) {
      if (!player) return null;
      if (player.prize) {
        return {
          name: player.prize,
          image: player.prizeImage || '',
          isWinner: player.prize !== '沒中'
        };
      }
      if (player.scratchTicketId && currentScratchTickets[player.scratchTicketId]) {
        const ticket = currentScratchTickets[player.scratchTicketId];
        const image = ticket.prizeIndex !== null && ticket.prizeIndex !== undefined
          ? (currentScratchPrizes?.[ticket.prizeIndex]?.image || '')
          : (ticket.image || '');
        return {
          name: ticket.prize || '沒中',
          image,
          isWinner: ticket.isWinner !== false && ticket.prize !== '沒中'
        };
      }
      return null;
    }

    function formatPrizeDisplay(prize, compact = false) {
      if (!prize) return '—';
      if (!prize.isWinner || prize.name === '沒中') {
        return `<span class="leaderboard-prize"><span style="font-size:${compact ? '18px' : '20px'};">🐢</span><span class="leaderboard-prize-name">沒中</span></span>`;
      }
      const img = prize.image
        ? `<img src="${prize.image}" alt="">`
        : `<span style="font-size:${compact ? '18px' : '20px'};">🎁</span>`;
      return `<span class="leaderboard-prize">${img}<span class="leaderboard-prize-name">${escapeHtml(prize.name)}</span></span>`;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
      }[ch]));
    }

    async function finishGameAndIssueScratch() {
      const roomRoot = ref(db, `rooms_v4/${roomId}`);
      let awarded = null;
      let nicknameAlreadyUsed = false;

      try {
        const result = await runTransaction(roomRoot, current => {
          if (!current) return current;
          current.usedNicknames = current.usedNicknames || {};
          current.scratchTickets = current.scratchTickets || {};
          const key = nicknameToKey(playerName);

          if (current.usedNicknames[key]) {
            nicknameAlreadyUsed = true;
            return;
          }

          const available = Object.entries(current.scratchTickets).filter(([, t]) => t && !t.claimed);
          if (available.length === 0) {
            // 沒有獎券時仍完成遊戲，但不發刮刮樂
            current.usedNicknames[key] = { name: playerName, completedAt: Date.now(), noTicket: true };
            if (current.players && current.players[playerId]) {
              current.players[playerId].timeUsedMs = timeUsedMs;
              current.players[playerId].status = 'ended';
              current.players[playerId].scratchTicketId = null;
            }
            return current;
          }

          const [ticketId, ticket] = available[Math.floor(Math.random() * available.length)];
          ticket.claimed = true;
          ticket.claimedBy = playerName;
          ticket.claimedAt = Date.now();
          current.usedNicknames[key] = { name: playerName, completedAt: Date.now(), ticketId };
          if (current.players && current.players[playerId]) {
            current.players[playerId].timeUsedMs = timeUsedMs;
            current.players[playerId].status = 'ended';
            current.players[playerId].scratchTicketId = ticketId;
            current.players[playerId].prize = ticket.prize || '沒中';
            current.players[playerId].prizeImage = ticket.prizeIndex !== null && ticket.prizeIndex !== undefined
              ? (current.scratchPrizes?.[ticket.prizeIndex]?.image || '')
              : '';
            current.players[playerId].isWinner = ticket.isWinner !== false && ticket.prize !== '沒中';
          }
          return current;
        });

        if (!result.committed) {
          alert('遊戲完成資料寫入失敗，請重新整理後確認排行榜。');
          return;
        }

        const latest = (await get(roomRoot)).val();
        const key = nicknameToKey(playerName);
        const record = latest?.usedNicknames?.[key];
        if (nicknameAlreadyUsed || !record) {
          alert(`暱稱【${playerName}】已經使用過，不能重複領取刮刮樂。`);
          return;
        }

        if (record.noTicket) {
          document.getElementById('game-over-mask').classList.remove('hidden');
          alert('🎉 恭喜完成挑戰！但本房間的刮刮樂已經發完了。');
          return;
        }

        const awardedTicket = latest.scratchTickets?.[record.ticketId];
        if (!awardedTicket) {
          document.getElementById('game-over-mask').classList.remove('hidden');
          return;
        }

        const awardedImage = awardedTicket.prizeIndex !== null && awardedTicket.prizeIndex !== undefined
          ? (latest.scratchPrizes?.[awardedTicket.prizeIndex]?.image || '')
          : (awardedTicket.image || '');

        awarded = { ...awardedTicket, image: awardedImage };
        showScratchModal(awarded);
      } catch (err) {
        console.error(err);
        alert('刮刮樂派發時發生錯誤，請重新整理頁面確認。');
      }
    }

    function showScratchModal(ticket) {
      const prize = ticket || { prize: '沒中', image: '', isWinner: false };
      document.getElementById('game-over-mask').classList.remove('hidden');

      const nameEl = document.getElementById('scratch-prize-name');
      const imgEl = document.getElementById('scratch-prize-image');
      if (prize.image && prize.isWinner !== false && prize.prize !== '沒中') {
        imgEl.src = prize.image;
        imgEl.style.display = 'block';
        imgEl.classList.remove('hidden');
        nameEl.innerText = prize.prize || '獎項';
      } else {
        imgEl.removeAttribute('src');
        imgEl.style.display = 'none';
        imgEl.classList.add('hidden');
        nameEl.innerText = '🐢 沒中';
      }

      document.getElementById('scratch-prize-text').innerText = prize.prize || '沒中';
      document.getElementById('scratch-reveal-text').classList.add('hidden');
      document.getElementById('scratch-modal').classList.remove('hidden');
      setupScratchCanvas(prize);
    }

    function setupScratchCanvas(ticket) {
      const canvas = document.getElementById('scratch-canvas');
      const wrap = document.getElementById('scratch-card');
      if (!canvas || !wrap) return;

      const prize = ticket || { prize: '沒中', image: '', isWinner: false };
      const rect = wrap.getBoundingClientRect();
      const w = Math.max(280, Math.floor(rect.width));
      const h = 190;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#a8a8a8';
      ctx.fillRect(0,0,w,h);
      ctx.fillStyle = '#666';
      ctx.font = 'bold 24px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🎫 刮開看看！', w/2, h/2 + 8);

      let scratching = false;
      let revealed = false;

      const reveal = () => {
        if (revealed) return;
        revealed = true;
        ctx.clearRect(0,0,w,h);
        const revealEl = document.getElementById('scratch-reveal-text');
        revealEl.classList.remove('hidden');

        const imgEl = document.getElementById('scratch-prize-image');
        const nameEl = document.getElementById('scratch-prize-name');
        if (!prize.isWinner || prize.prize === '沒中') {
          imgEl.classList.add('hidden');
          nameEl.innerText = '🐢 沒中';
          revealEl.innerText = '🐢 沒刮中，下次再接再厲！';
        } else {
          if (prize.image) {
            imgEl.src = prize.image;
            imgEl.style.display = 'block';
            imgEl.classList.remove('hidden');
          }
          nameEl.innerText = prize.prize || '恭喜獲獎';
          revealEl.innerText = `🎉 恭喜！${prize.prize || '獲得獎項'}`;
        }
      };

      const scratch = (e) => {
        if (revealed) return;
        const r = canvas.getBoundingClientRect();
        const point = e.touches ? e.touches[0] : e;
        const x = point.clientX - r.left;
        const y = point.clientY - r.top;
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x,y,24,0,Math.PI*2);
        ctx.fill();
        if (isScratchEnough(ctx,w,h)) reveal();
      };

      canvas.onmousedown = e => { scratching=true; scratch(e); };
      canvas.onmousemove = e => { if (scratching) scratch(e); };
      canvas.onmouseup = () => scratching=false;
      canvas.onmouseleave = () => scratching=false;
      canvas.ontouchstart = e => { e.preventDefault(); scratching=true; scratch(e); };
      canvas.ontouchmove = e => { e.preventDefault(); if (scratching) scratch(e); };
      canvas.ontouchend = () => scratching=false;
    }

    function isScratchEnough(ctx,w,h) {
      const img = ctx.getImageData(0,0,w,h).data;
      let transparent = 0;
      for (let i=3;i<img.length;i+=4) if (img[i] < 50) transparent++;
      return transparent / (w*h) >= 0.35;
    }

    function revealScratch() {
      const canvas = document.getElementById('scratch-canvas');
      const name = document.getElementById('scratch-prize-text').innerText || '沒中';
      const imgEl = document.getElementById('scratch-prize-image');
      const ctx = canvas?.getContext('2d');
      if (ctx) ctx.clearRect(0,0,canvas.width,canvas.height);

      const revealEl = document.getElementById('scratch-reveal-text');
      revealEl.classList.remove('hidden');
      if (name === '沒中') {
        imgEl.style.display = 'none';
        imgEl.classList.add('hidden');
        document.getElementById('scratch-prize-name').innerText = '🐢 沒中';
        revealEl.innerText = '🐢 沒刮中，下次再接再厲！';
      } else {
        document.getElementById('scratch-prize-name').innerText = name;
        revealEl.innerText = `🎉 恭喜！${name}`;
      }
    }

    function closeScratchModal() {
      document.getElementById('scratch-modal').classList.add('hidden');
    }

    function renderLeaderboard(elementId, players) {
      const lbEl = document.getElementById(elementId);
      if (!lbEl) return;

      const sorted = Object.entries(players)
        .map(([id, p]) => ({ id, ...p }))
        .sort((a, b) => {
          if (a.status === 'ended' && b.status !== 'ended') return -1;
          if (a.status !== 'ended' && b.status === 'ended') return 1;
          return (a.timeUsedMs || Infinity) - (b.timeUsedMs || Infinity);
        });

      const header = `
        <div class="leaderboard-header">
          <span>玩家</span>
          <span>完成時間</span>
          <span style="text-align:right;">獎項</span>
        </div>`;

      const rows = sorted.map((p, idx) => {
        let timeDisplay = '挑戰中...';
        if (p.timeUsedMs) {
          const secondsFormatted = (p.timeUsedMs / 1000).toFixed(3);
          timeDisplay = `<span style="color:#059669;">⏱️ ${secondsFormatted}秒</span>`;
        }

        const prize = getPlayerPrize(p);
        return `
          <div class="leaderboard-item ${p.id === playerId ? 'me' : ''}">
            <span>#${idx + 1} ${escapeHtml(p.name)} ${p.id === playerId ? '(你)' : ''}</span>
            <span>${timeDisplay} ${p.status === 'ended' ? '(已完成)' : ''}</span>
            ${formatPrizeDisplay(prize, true)}
          </div>
        `;
      }).join('');

      lbEl.innerHTML = header + (rows || '<div style="color:#94a3b8; font-size:13px;">尚無玩家資料...</div>');
    }

    function initSecurity() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }
  </script>
</head>

        <div style="font-size:12px;color:#64748b;margin:5px 0 8px;">
          每個獎項可設定「名稱、數量、圖片」。圖片會在建立房間時一起保存並可供玩家刮開後預覽。
          若獎項數量未填滿總張數，剩餘張數自動設定為 🐢 沒中。
        </div>

        <div class="scratch-prize-row" style="background:#f8fafc;border-color:#e2e8f0;font-size:11px;color:#64748b;font-weight:bold;padding:6px 8px;">

  <button id="admin-unlock-btn" class="btn-primary btn-admin" onclick="openAdminModal()">🔑 解鎖管理者設定</button>

  <div id="admin-action-area" class="hidden">

  <div class="modal" style="max-width:430px; text-align:center;">

    <div id="scratch-card" style="position:relative;width:100%;max-width:360px;height:190px;margin:10px auto;border-radius:14px;overflow:hidden;background:#fff7ed;border:3px solid #f59e0b;box-shadow:0 8px 20px rgba(0,0,0,.12);">
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#b45309;padding:10px;">
        <img id="scratch-prize-image" class="scratch-result-image" alt="獎項圖片">
        <span id="scratch-prize-name">獎項</span>
        <span id="scratch-prize-text" class="hidden"></span>
      </div>
      <canvas id="scratch-canvas" style="position:absolute;left:0;top:0;touch-action:none;cursor:crosshair;"></canvas>
    </div>
    <div id="scratch-reveal-text" class="hidden" style="font-size:22px;font-weight:bold;color:#dc2626;margin:12px 0;"></div>
    <button class="btn-primary btn-admin" style="margin-top:8px;" onclick="closeScratchModal()">關閉</button>
  </div>
</div>
