<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>種菜刮刮樂</title>
    <!-- 引入 html2canvas 截圖函式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- 引入 Firebase SDK (Compat 版本) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "MicroSoft YaHei", "PingFang TC", sans-serif;
        }

        body {
            background-color: #fce4ec;
            background-image: url("https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images2/BK01.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        h1 {
            color: #d32f2f;
            text-shadow: 2px 2px #ffcdd2;
            margin-bottom: 12px;
            font-size: 1.8rem;
            text-align: center;
        }

        /* 頁面分頁控制 */
        .page {
            display: none;
            width: 100%;
            max-width: 900px;
            flex-direction: column;
            align-items: center;
        }

        .page.active {
            display: flex;
        }

        /* 設定區塊 */
        .config-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            margin-bottom: 15px;
        }

        .config-panel h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .input-row label {
            font-size: 0.85rem;
            color: #666;
            white-space: nowrap;
        }

        .input-group input[type="text"], 
        .input-group input[type="password"] {
            flex-grow: 1;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.85rem;
            min-width: 0;
            height: 36px;
            user-select: text;
        }

        /* 時間輸入框樣式 */
        .input-group input[type="datetime-local"] {
            flex-grow: 1;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.85rem;
            min-width: 0;
            height: 36px;
            user-select: text;
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            align-items: center;
        }

        .input-group input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            margin-right: 8px;
            margin-left: 0;
            cursor: pointer;
        }

        .input-group input[type="number"] {
            width: 65px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            height: 36px;
            user-select: text;
        }

        /* 切換模式頁籤 (Tabs) */
        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            border-bottom: 2px solid #ffe0b2;
            padding-bottom: 4px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #ffb74d;
            color: #fff;
        }

        .mode-content {
            display: none;
            margin-bottom: 12px;
        }

        .mode-content.active {
            display: block;
        }

        textarea {
            width: 100%;
            height: 60px;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-size: 0.85rem;
            user-select: text;
        }

        .prize-item-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
        }

        .prize-item-row .a-prize-name {
            width: 170px;
            flex-grow: 0;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.85rem;
            height: 36px; 
            user-select: text;
        }

        .prize-item-row .a-prize-count {
            width: 75px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            height: 36px;
            user-select: text;
        }

        .btn-add-item {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 4px;
            font-weight: bold;
        }

        .btn-del-item {
            background-color: #e53935;
            color: white;
            border: none;
            width: 32px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-apply {
            width: 100%;
            padding: 10px;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-apply:hover {
            background-color: #b71c1c;
        }

        /* 回到遊戲大廳按鈕專用樣式 */
        .btn-lobby {
            width: 100%;
            max-width: 250px;
            margin: 12px auto 0 auto;
            background-color: #00897b;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .btn-lobby:hover {
            background-color: #00695c;
        }

        /* 按鈕群組通用樣式 */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-action {
            flex: 1;
            min-width: 140px;
            max-width: 250px;
            background-color: #0288d1;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-copy-list { background-color: #2e7d32; }
        .btn-purple { background-color: #7b1fa2; }
        .btn-orange { background-color: #e65100; }

        /* 截圖目標區塊 */
        .capture-area {
            background-color: #fce4ec;
            padding: 10px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .event-title {
            color: #d32f2f;
            text-shadow: 2px 2px #ffcdd2;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 8px;
        }

        .time-box {
            background-color: #ffe0b2;
            color: #e65100;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .prizes-count {
            color: #d32f2f;
            font-weight: 800;
        }

        /* 刮刮樂網格外框 */
        .poke-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(max(70px, calc(10% - 6px)), 1fr));
            gap: 6px;
            background-color: #d32f2f;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            width: 100%;
            box-sizing: border-box;
        }

        /* 玩家頁面刮刮樂大小設定：以手機螢幕寬度為主進行微調 */
        #playerPokeBox {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            width: min(320px, 85vw);
            height: min(320px, 85vw);
            margin: 10px auto;
        }

        #playerPokeBox .cell {
            width: 100%;
            height: 100%;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            border-radius: 12px;
        }

        #playerPokeBox .turtle-icon {
            font-size: clamp(3.5rem, 12vw, 5.5rem);
        }

        #playerPokeBox .winner-name {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            padding: 4px 10px;
            margin-top: 8px;
        }

        @media (max-width: 500px) {
            .poke-box {
                grid-template-columns: repeat(5, 1fr) !important;
                gap: 4px;
                padding: 6px;
            }
        }

        /* 刮開後的基礎底色設定 */
        .cell {
            position: relative;
            aspect-ratio: 1;
            background-color: #ffffff;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: #333;
            text-align: center;
            padding: 2px;
            word-break: break-all;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        /* 得獎格：顯眼的亮金色漸層 + 亮眼邊框光芒 */
        .cell.winning {
            background: #ffe082;
            background: linear-gradient(135deg, #fff9c4, #ffe082);
            color: #b71c1c;
            border: 2px solid #ffa000;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.6), inset 0 0 5px rgba(255, 255, 255, 0.8);
        }

        /* 沒中獎（烏龜格）：柔和灰白 */
        .cell.turtle {
            background-color: #f1f3f4;
            color: #546e7a;
            border: 1px solid #cfd8dc;
        }

        .turtle-icon {
            font-size: 1.7rem;
            line-height: 1;
        }

        .winner-name {
            color: #0d47a1;
            font-size: 0.7rem;
            font-weight: bold;
            margin-top: 1px;
            background-color: rgba(227, 242, 253, 0.95);
            padding: 0px 4px;
            border-radius: 3px;
            border: 1px solid #90caf9;
            line-height: 1.1;
            max-width: 95%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 刮刮樂 Canvas 膜樣式 */
        .scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
            touch-action: none;
            border-radius: 5px;
        }

        /* 未開出獎品清單樣式：一列二欄呈現 */
        .unopened-prizes-box {
            width: 100%;
            background: #ffffff;
            border: 2px dashed #ffb74d;
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .unopened-prizes-title {
            font-size: 0.88rem;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 8px;
            text-align: center;
            border-bottom: 1px dashed #ffe0b2;
            padding-bottom: 4px;
        }

        .unopened-prizes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px 12px;
        }

        .unopened-prize-item {
            font-size: 0.8rem;
            color: #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff8e1;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #ffe082;
        }

        .unopened-prize-name {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .unopened-prize-count {
            color: #d32f2f;
            font-weight: bold;
            white-space: nowrap;
        }

        .footer-row {
            display: flex;
            width: 100%;
            margin-top: 8px;
            align-items: center;
            box-sizing: border-box;
            padding: 0 4px;
        }

        .note-display {
            width: 66.66%;
            color: #d84315;
            font-size: 0.85rem;
            font-weight: bold;
            word-break: break-all;
            text-align: left;
        }

        .copyright-display {
            width: 33.33%;
            color: #d84315;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: right;
            white-space: nowrap;
        }

        /* 登入面板通用卡片 */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .login-card h2 { color: #d32f2f; font-size: 1.3rem; text-align: center; }
        .login-card input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            user-select: text;
        }

        /* 列表區塊 */
        .winner-list-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            margin-top: 12px;
        }

        .winner-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .winner-table th, .winner-table td {
            border: 1px solid #ffe0b2;
            padding: 6px 8px;
            text-align: center;
        }

        .winner-table th { background-color: #fff3e0; color: #e65100; }
        .no-data { color: #999; text-align: center; padding: 10px; }
    </style>
</head>
<body>

    <!-- 主頁面頂部標題 -->
    <h1 id="mainTitleHeader">🎫 種菜刮刮樂 🎫</h1>

    <!-- ==================== 頁面一：主控與設定頁面 ==================== -->
    <div id="pageMain" class="page active">
        <!-- 主頁面登入卡片 -->
        <div id="adminLoginCard" class="login-card">
            <h2>🔑 管理員登入</h2>
            <input type="password" id="inputAdminPass" placeholder="請輸入主控密碼">
            <button class="btn-apply" onclick="loginAdmin()">進入管理後台</button>
              <!-- 回到遊戲大廳按鈕 -->
             <a href="https://sile9999.github.io/all-in-one-games/" class="btn-lobby">🏠 回到遊戲大廳</a>
        </div>

        <!-- 管理員主要控制內容 (驗證成功後顯示) -->
        <div id="adminContentArea" style="display: none; width: 100%;">
            <div class="config-panel">
                <h3>⚙️ 遊戲設定 (主控面版)</h3>
                <div class="input-group">
                    <div class="input-row">
                        <label for="eventName">活動名稱：</label>
                        <input type="text" id="eventName" placeholder="例如：小寶愛蛙">
                    </div>
                    <div class="input-row">
                        <label for="endTime"> 結束時間：</label>
                        <input type="datetime-local" id="endTime">
                    </div>
                    <div class="input-row">
                        <label for="roomPassword"> 房間密碼：</label>
                        <input type="text" id="roomPassword" value="8888" placeholder="設定玩家進入密碼">
                    </div>
                    <div class="input-row">
                        <label for="totalCount">格子數量：</label>
                        <input type="number" id="totalCount" value="36" min="5" step="1">
                    </div>
                    <div class="input-row">
                        <label for="maxPokesPerUser">每人次數：</label>
                        <input type="number" id="maxPokesPerUser" value="1" min="1" step="1">
                    </div>
                    <div class="input-row">
                        <label for="eventNote">備註說明：</label>
                        <input type="text" id="eventNote" value="每人限刮一次">
                    </div>
                    <!-- 新增是否顯示未開出獎品清單選項 -->
                    <div class="input-row" style="margin-top: 4px;">
                        <input type="checkbox" id="showUnopenedPrizes" checked style="width: 18px; height: 18px; cursor: pointer;">
                        <label for="showUnopenedPrizes" style="font-weight: bold; color: #d32f2f; cursor: pointer;">顯示未開出獎品清單</label>
                    </div>
                </div>
                
                <label style="font-size: 0.8rem; color: #333; font-weight: bold; display: block; margin-bottom: 4px;">
                    🎁 獎品清單設定方式：
                </label>
                <div class="mode-tabs">
                    <button class="tab-btn active" onclick="switchMode('A')">模式 A：品名 + 數量拆分</button>
                    <button class="tab-btn" onclick="switchMode('B')">模式 B：自由文字輸入</button>
                </div>

                <div id="modeA" class="mode-content active">
                    <div id="prizeListContainer">
                        <div class="prize-item-row">
                            <input type="text" class="a-prize-name" placeholder="獎品名稱" maxlength="20">
                            <input type="number" class="a-prize-count" placeholder="數量" value="1" min="1">
                            <button class="btn-del-item" onclick="removePrizeRow(this)">✕</button>
                        </div>
                    </div>
                    <button class="btn-add-item" onclick="addPrizeRow()">＋ 新增獎品項目</button>
                </div>

                <div id="modeB" class="mode-content">
                    <textarea id="prizeInput" placeholder="例如：禮盒, 特輯, 二獎"></textarea>
                </div>

                <button class="btn-apply" onclick="publishNewGame()">生成全新同步刮刮樂</button>
                
                <div class="button-group" style="margin-top: 12px;">
                    <a href="#player" target="_blank" class="btn-action btn-orange">🚀 開啟玩家連線頁</a>
                    <button class="btn-action btn-purple" id="copyPlayerInfoBtn" onclick="copyPlayerInfo()">📋 複製刮刮網址</button>
                </div>
            </div>

            <!-- 截圖與即時開獎面板 -->
            <div class="capture-area" id="captureArea">
                <div class="event-title" id="eventTitleDisplay" style="display: none;"></div>
                <div class="toolbar">
                    <div class="time-box">
                        <div>🕒 <span id="clock">載入時間...</span></div>
                        <div>🎁 剩餘大獎：<span class="prizes-count" id="remainingPrizesCount">0 / 0</span></div>
                    </div>
                </div>
                
                <!-- 刮刮樂主區塊 -->
                <div class="poke-box" id="mainPokeBox"></div>

                <!-- 開獎區塊下方：未開出獎品清單 (一列二欄) -->
                <div class="unopened-prizes-box" id="mainUnopenedBox" style="display: none;">
                    <div class="unopened-prizes-title">🎁 未開出獎品清單</div>
                    <div class="unopened-prizes-grid" id="mainUnopenedList"></div>
                </div>

                <div class="footer-row">
                    <div class="note-display" id="noteDisplay">※ 每人限刮一次 ※</div>
                    <div class="copyright-display">©2026乳蕉四妻🐸</div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-action" id="screenshotBtn" onclick="copyScreenshot()">📋 複製截圖</button>
                <button class="btn-action btn-copy-list" id="copyListBtn" onclick="copyWinnerList()">📝 複製得獎列表</button>
            </div>

            <div class="winner-list-panel">
                <h3>🏆 開獎即時紀錄</h3>
                <div id="winnerTableContainer"><div class="no-data">尚無開獎紀錄</div></div>
                <a href="https://sile9999.github.io/all-in-one-games/" class="btn-lobby">🏠 回到遊戲大廳</a>
            </div>
        </div>
    </div>

    <!-- ==================== 頁面二：多人連線玩家頁面 ==================== -->
    <div id="pagePlayer" class="page">
        <!-- 登入卡片 -->
        <div id="playerLoginCard" class="login-card">
            <h2 id="loginCardTitle">🎮 加入連線刮刮樂</h2>
            <input type="password" id="inputRoomPass" placeholder="請輸入房間密碼">
            <input type="text" id="inputPlayerName" placeholder="請輸入您的暱稱">
            <button class="btn-apply" onclick="loginPlayer()">進入遊戲</button>
        </div>

        <!-- 玩家遊戲畫面 (登入後顯示) -->
        <div id="playerGameArea" style="display: none; width: 100%;">
            <div style="background: rgba(255, 255, 255, 0.95); padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                <div>👤 玩家：<strong id="displayName" style="color: #d32f2f;"></strong></div>

        // 時間格式化工具
        function formatDate(timestamp) {
            if (!timestamp) return "-";
            const date = new Date(timestamp);
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            const ss = String(date.getSeconds()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
        }

        function formatShortDate(timestamp) {
            if (!timestamp) return "";
            const date = new Date(timestamp);
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];

        // 主頁面：生成全新同步遊戲
        function publishNewGame() {
            const eventName = document.getElementById('eventName').value.trim();
            const password = document.getElementById('roomPassword').value.trim();
            const endTimeValue = document.getElementById('endTime').value;
            const note = document.getElementById('eventNote').value.trim();
            const totalCells = parseInt(document.getElementById('totalCount').value) || 36;
            const maxPokesPerUser = Math.max(1, parseInt(document.getElementById('maxPokesPerUser').value) || 1);
            const showUnopenedPrizes = document.getElementById('showUnopenedPrizes').checked;

            if(!password) {
                alert("請務必設定玩家頁連線密碼！");
                return;
            }

            const endTimeStamp = endTimeValue ? new Date(endTimeValue).getTime() : 0;

            let prizeList = [];
            if (activeMode === 'A') {
                document.querySelectorAll('.prize-item-row').forEach(row => {
                    const name = row.querySelector('.a-prize-name').value.trim();
                    const count = parseInt(row.querySelector('.a-prize-count').value) || 0;
                    if (name && count > 0) {
                        for (let i = 0; i < count; i++) prizeList.push(name);
                    }
                });
            } else {
                const rawInput = document.getElementById('prizeInput').value;
                prizeList = rawInput.split(/[,，\n]/).map(i => i.trim()).filter(i => i !== "");
            }

            while (prizeList.length < totalCells) prizeList.push("🐢 烏龜");
            if (prizeList.length > totalCells) prizeList = prizeList.slice(0, totalCells);

            const shuffledPrizes = shuffle(prizeList);

            const cellsData = shuffledPrizes.map((prize, idx) => ({
                id: idx + 1,
                prize: prize,
                isPoked: false,
                winner: "",
                pokedAt: 0,
                coverEmoji: "🎫"

            const gamePayload = {
                eventName: eventName,
                password: password,
                endTime: endTimeStamp,
                note: note,
                totalCells: totalCells,
                maxPokesPerUser: maxPokesPerUser,
                showUnopenedPrizes: showUnopenedPrizes,
                cells: cellsData,
                updatedAt: Date.now()
            };

            gameRef.set(gamePayload).then(() => {
                alert("全新同步刮刮樂已建立！");
            });

        // 實時連線監聽 (Firebase Listener)
        gameRef.on("value", (snapshot) => {

        // 核心功能：計算未開出的大獎清單
        function calculateUnopenedPrizes(cells) {
            const unopenedMap = {};
            cells.forEach(cell => {
                if (!cell.isPoked && !cell.prize.includes("烏龜")) {
                    unopenedMap[cell.prize] = (unopenedMap[cell.prize] || 0) + 1;

        // 渲染未開出大獎清單（一列二欄）
        function renderUnopenedBox(boxEl, listEl, showFlag, cells) {

        // 創建銀色刮刮樂 Canvas
        function setupScratchCanvas(cellEl, onScratchComplete) {
            const canvas = document.createElement('canvas');
            canvas.className = 'scratch-canvas';
            cellEl.appendChild(canvas);

            const rect = cellEl.getBoundingClientRect();
            canvas.width = rect.width || 80;
            canvas.height = rect.height || 80;

            const ctx = canvas.getContext('2d');

            // 繪製銀灰色銀漆漸層
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#d6d6d6');
            grad.addColorStop(0.5, '#f8f8f8');
            grad.addColorStop(1, '#b0b0b0');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 載入並繪製塗層圖片
            const coverImg = new Image();
            coverImg.crossOrigin = "Anonymous";
            coverImg.src = "https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images2/cow.png";
            coverImg.onload = function() {
                // 等比例縮放並置中繪製圖片
                const padding = canvas.width * 0.1;
                const maxW = canvas.width - padding * 2;
                const maxH = canvas.height - padding * 2;
                let drawW = coverImg.width;
                let drawH = coverImg.height;

                const ratio = Math.min(maxW / drawW, maxH / drawH);
                drawW *= ratio;
                drawH *= ratio;

                const drawX = (canvas.width - drawW) / 2;
                const drawY = (canvas.height - drawH) / 2;

                ctx.drawImage(coverImg, drawX, drawY, drawW, drawH);
            };

            let isDrawing = false;
            let isTriggered = false;

            // 修正座標計算：加入 Canvas 寬高與 CSS 縮放比例轉換，解決滑鼠偏移問題
            function getPos(e) {
                const r = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = canvas.width / r.width;
                const scaleY = canvas.height / r.height;
                return {
                    x: (clientX - r.left) * scaleX,
                    y: (clientY - r.top) * scaleY
                };
            }

            function scratch(e) {
                if (!isDrawing || isTriggered) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                const radius = Math.max(14, canvas.width * 0.1);
                ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                ctx.fill();

                checkScratchProgress();
            }

            function checkScratchProgress() {
                if (isTriggered) return;
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = imageData.data;
                let transparentPixels = 0;
                for (let i = 3; i < pixels.length; i += 4) {
                    if (pixels[i] === 0) transparentPixels++;
                }
                const percent = (transparentPixels / (pixels.length / 4)) * 100;

                // 刮開超過 35% 判定為完成，自動揭曉
                if (percent > 70) {
                    isTriggered = true;
                    canvas.style.transition = 'opacity 0.3s ease';
                    canvas.style.opacity = '0';
                    setTimeout(() => {
                        canvas.remove();
                    }, 300);
                    onScratchComplete();
                }
            }

            canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
            canvas.addEventListener('mousemove', scratch);
            window.addEventListener('mouseup', () => { isDrawing = false; });

            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, { passive: false });
            canvas.addEventListener('touchmove', scratch, { passive: false });
            canvas.addEventListener('touchend', () => { isDrawing = false; });
        }

        // 渲染主控頁面
        function renderMainBoard(data) {
            const titleEl = document.getElementById('eventTitleDisplay');
            if (data.eventName) {
                titleEl.innerText = "🍌 " + data.eventName + " 刮刮樂 🍌";
                titleEl.style.display = "block";
            } else titleEl.style.display = "none";

            document.getElementById('noteDisplay').innerText = data.note ? "※ " + data.note + " ※" : "";

            const totalBigPrizes = data.cells.filter(c => !c.prize.includes("烏龜")).length;
            const revealedBigPrizes = data.cells.filter(c => c.isPoked && !c.prize.includes("烏龜")).length;
            document.getElementById('remainingPrizesCount').innerText = `${Math.max(0, totalBigPrizes - revealedBigPrizes)} / ${totalBigPrizes}`;

            const pokeBox = document.getElementById('mainPokeBox');
            pokeBox.innerHTML = "";

            data.cells.forEach(cell => {
                const cellEl = document.createElement('div');
                const isTurtle = cell.prize.includes("烏龜");
                cellEl.className = `cell ${cell.isPoked ? (isTurtle ? 'turtle' : 'winning') : ''}`;

                if (cell.isPoked) {
                    const winnerHtml = cell.winner ? `<div class="winner-name">${cell.winner}</div>` : '';

                    if (isTurtle) {
                        cellEl.innerHTML = `<div class="turtle-icon">🐢</div>${winnerHtml}`;
                    } else {
                        cellEl.innerHTML = `<div style="font-weight:bold;">${cell.prize}</div>${winnerHtml}`;
                    }
                } else {
                    const winnerHtml = cell.winner ? `<div class="winner-name">${cell.winner}</div>` : '';
                    cellEl.innerHTML = isTurtle ? `<div class="turtle-icon">🐢</div>${winnerHtml}` : `<div style="font-weight:bold;">${cell.prize}</div>${winnerHtml}`;
                    
                    setupScratchCanvas(cellEl, () => {
                        handleAdminPoke(cell.id - 1, cell);
                    });
                }
                pokeBox.appendChild(cellEl);
            });

            // 渲染未開出獎品清單
            const showFlag = data.showUnopenedPrizes !== false;
            renderUnopenedBox(
                document.getElementById('mainUnopenedBox'),
                document.getElementById('mainUnopenedList'),
                showFlag,
                data.cells
            );
        }

        // 管理者主頁面代刮
        function handleAdminPoke(index, cell) {
            if (cell.isPoked) return;

            db.ref(`sharedPokeGame/cells/${index}`).update({
                isPoked: true,
                winner: "",
                pokedAt: Date.now()
            });
        }

        // 渲染玩家頁面 (僅隨機出現一格)
        function renderPlayerBoard(data) {
            const titleEl = document.getElementById('playerEventTitle');
            const loginTitleEl = document.getElementById('loginCardTitle');
            
            const displayTitle = data.eventName ? `🍌 ${data.eventName} 刮刮樂 🍌` : "🎫 種菜刮刮樂 🎫";
            
            if (titleEl) {
                titleEl.innerText = displayTitle;
                titleEl.style.display = "block";
            }
            if (loginTitleEl) {
                loginTitleEl.innerText = displayTitle;
            }

            document.getElementById('playerNoteDisplay').innerText = data.note ? "※ " + data.note + " ※" : "";

            const totalBigPrizes = data.cells.filter(c => !c.prize.includes("烏龜")).length;
            const revealedBigPrizes = data.cells.filter(c => c.isPoked && !c.prize.includes("烏龜")).length;
            const playerRemEl = document.getElementById('playerRemainingPrizesCount');
            if (playerRemEl) {
                playerRemEl.innerText = `${Math.max(0, totalBigPrizes - revealedBigPrizes)} / ${totalBigPrizes}`;
            }

            const pokeBox = document.getElementById('playerPokeBox');
            pokeBox.innerHTML = "";

            const hasBigPrizesLeft = data.cells.some(c => !c.prize.includes("烏龜") && !c.isPoked);
            const isExpired = data.endTime && Date.now() > data.endTime;
            
            const maxPokes = data.maxPokesPerUser || 1;
            const userPokedCells = currentPlayerName ? data.cells.filter(c => c.isPoked && c.winner === currentPlayerName) : [];
            const userPokedCount = userPokedCells.length;
            const hasReachedLimit = userPokedCount >= maxPokes;

            const statusTag = document.getElementById('playerStatusTag');
            
            if (!hasBigPrizesLeft) {
                statusTag.innerText = "⛔ 活動已結束 (大獎已全數刮完)";
                statusTag.style.color = "#d32f2f";
            } else if (isExpired) {
                statusTag.innerText = "⏰ 活動已截止";
                statusTag.style.color = "#d32f2f";
            } else if (hasReachedLimit) {
                statusTag.innerText = `❌ 您已完成刮獎 (已達限額 ${maxPokes} 次)`;
                statusTag.style.color = "#d32f2f";
            } else {
                statusTag.innerText = `✅ 請刮開您獲得的這張刮刮樂 (已刮 ${userPokedCount}/${maxPokes} 次)`;
                statusTag.style.color = "#2e7d32";
            }

            // 若玩家已經刮過，直接顯示玩家刮過的那一格；若尚未刮過，隨機從未開出的格子中分配一格
            if (hasReachedLimit) {
                const lastPokedCell = userPokedCells[userPokedCells.length - 1];
                if (lastPokedCell) {
                    const cellEl = document.createElement('div');
                    const isTurtle = lastPokedCell.prize.includes("烏龜");
                    cellEl.className = `cell ${isTurtle ? 'turtle' : 'winning'}`;
                    const winnerHtml = `<div class="winner-name">${lastPokedCell.winner}</div>`;
                    cellEl.innerHTML = isTurtle ? `<div class="turtle-icon">🐢</div>${winnerHtml}` : `<div style="font-weight:bold;">${lastPokedCell.prize}</div>${winnerHtml}`;
                    pokeBox.appendChild(cellEl);
                }
            } else {
                // 如果目前隨機指定的格子已被他人刮開或尚未指定，重新隨機分配一格未刮開的格子
                const unpokedIndexes = data.cells.map((c, i) => c.isPoked ? -1 : i).filter(i => i !== -1);
                if (unpokedIndexes.length > 0) {
                    if (playerAssignedCellIndex === null || data.cells[playerAssignedCellIndex].isPoked) {
                        playerAssignedCellIndex = unpokedIndexes[Math.floor(Math.random() * unpokedIndexes.length)];
                    }

                    const targetCell = data.cells[playerAssignedCellIndex];
                    const cellEl = document.createElement('div');
                    cellEl.className = 'cell';
                    const isTurtle = targetCell.prize.includes("烏龜");
                    cellEl.innerHTML = isTurtle ? `<div class="turtle-icon">🐢</div>` : `<div style="font-weight:bold;">${targetCell.prize}</div>`;
                    
                    setupScratchCanvas(cellEl, () => {
                        handlePlayerPoke(targetCell.id - 1, targetCell, hasReachedLimit, isExpired, hasBigPrizesLeft, maxPokes);
                    });
                    pokeBox.appendChild(cellEl);
                } else {
                    pokeBox.innerHTML = `<div style="color:#fff; font-weight:bold;">所有格子皆已全數刮完</div>`;
                }
            }

            // 渲染玩家頁未開出獎品清單
            const showFlag = data.showUnopenedPrizes !== false;
            renderUnopenedBox(
                document.getElementById('playerUnopenedBox'),
                document.getElementById('playerUnopenedList'),
                showFlag,
                data.cells
            );
        }

        // 玩家點擊刮開開獎
        function handlePlayerPoke(index, cell, hasReachedLimit, isExpired, hasBigPrizesLeft, maxPokes) {
            if (!hasBigPrizesLeft) {
                alert("⛔ 活動已結束，所有大獎都已經被刮完囉！");
                return;
            }

            if (isExpired || (currentGameData.endTime && Date.now() > currentGameData.endTime)) {
                alert("⏰ 活動時間已結束，無法再進行刮獎囉！");
                return;
            }

            if (!currentPlayerName) {
                alert("請先登入名字！");
                return;
            }
            
            const userPokedCount = currentGameData.cells.filter(c => c.isPoked && c.winner === currentPlayerName).length;
            if (userPokedCount >= maxPokes) {
                alert(`玩家【${currentPlayerName}】已經達到刮獎上限囉！每人限刮 ${maxPokes} 次。`);
                return;
            }

            if (cell.isPoked) {
                alert("這一格已經被別人刮開囉！系統將自動為您重配一格。");
                renderPlayerBoard(currentGameData);
                return;
            }

            db.ref(`sharedPokeGame/cells/${index}`).update({
                isPoked: true,
                winner: currentPlayerName,
                pokedAt: Date.now()
            }).then(() => {
                const isTurtle = cell.prize.includes("烏龜");
                if (isTurtle) {
                    alert(`🐢 沒中獎～ 刮出了烏龜！`);
                } else {
                    alert(`🎉 恭喜中獎！您刮中了：【${cell.prize}】`);
                }
            });
        }

        function loginPlayer() {
            const passInput = document.getElementById('inputRoomPass').value.trim();
            const nameInput = document.getElementById('inputPlayerName').value.trim();

            if (!currentGameData) {
                alert("主持人尚未建立遊戲！");
                return;
            }
            if (passInput !== currentGameData.password) {
                alert("房間密碼錯誤！");
                return;
            }
            if (!nameInput) {
                alert("請輸入您的遊戲暱稱！");
                return;
            }

            currentPlayerName = nameInput;
            playerAssignedCellIndex = null; // 初始化重置隨機指定格
            document.getElementById('displayName').innerText = currentPlayerName;
            document.getElementById('playerLoginCard').style.display = 'none';
            document.getElementById('playerGameArea').style.display = 'block';

            if(currentGameData) renderPlayerBoard(currentGameData);
        }

        function renderWinnerTable(data) {
            const container = document.getElementById('winnerTableContainer');
            const pokedCells = data.cells.filter(c => c.isPoked);

            if (pokedCells.length === 0) {
                container.innerHTML = '<div class="no-data">尚無開獎紀錄</div>';
                return;
            }

            let html = `
                <table class="winner-table">
                    <thead>
                        <tr>
                            <th style="width: 15%;">欄位</th>
                            <th style="width: 35%;">獎品內容</th>
                            <th style="width: 25%;">得獎者</th>
                            <th style="width: 25%;">開獎時間</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            pokedCells.forEach(item => {
                const isTurtle = item.prize.includes("烏龜");
                const displayName = item.winner ? item.winner : "(管理者代刮)";
                html += `
                    <tr>
                        <td><strong>第 ${item.id} 格</strong></td>
                        <td>${item.prize}</td>
                        <td style="color: ${isTurtle ? '#607d8b' : '#0d47a1'}; font-weight: bold;">${displayName}</td>
                        <td style="color: #666; font-size: 0.75rem;">${formatDate(item.pokedAt)}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        async function copyWinnerList() {
            if (!currentGameData) return;
            const pokedCells = currentGameData.cells.filter(c => c.isPoked);

            if (pokedCells.length === 0) {
                alert("目前尚無任何開獎紀錄喔！");
                return;
            }

            const winners = pokedCells.filter(c => !c.prize.includes("烏龜"));
            const turtles = pokedCells.filter(c => c.prize.includes("烏龜"));

            const eventName = currentGameData.eventName;
            const titleText = eventName ? `${eventName}刮刮樂 - 開獎名單` : "刮刮樂開獎名單";
            const currentTimeStr = formatDate(Date.now());

            let text = `🏆【${titleText}】🏆\n`;
            text += `🕒 時間：${currentTimeStr}\n`;
            text += `-----------------------------\n`;
            text += `🎁【中獎名單】\n`;

            if (winners.length > 0) {
                winners.forEach(item => {
                    const name = item.winner ? item.winner : "管理者代刮";
                    text += `• ${item.prize} ➔ @${name}\n`;
                });
            } else {
                text += `(尚無中獎紀錄)\n`;
            }

            text += `\n🐢【未得獎/烏龜名單】\n`;
            if (turtles.length > 0) {
                turtles.forEach(item => {
                    const name = item.winner ? item.winner : "管理者代刮";
                    text += `• 烏龜 ➔ ${name}\n`;
                });
            } else {
                text += `(尚無未得獎紀錄)\n`;
            }

            try {
                await navigator.clipboard.writeText(text);
                const btn = document.getElementById('copyListBtn');
                btn.innerText = "✅ 列表已複製！";
                setTimeout(() => btn.innerText = "📝 複製得獎列表", 2000);
            } catch (err) {
                alert("複製失敗，請手動複製！");
            }
        }

        // 複製截圖 (優化渲染與色差修正)
        async function copyScreenshot() {
            const captureArea = document.getElementById('captureArea');
            const btn = document.getElementById('screenshotBtn');
            const originalText = btn.innerText;

            btn.innerText = "⏳ 截圖處理中...";
            btn.disabled = true;

            try {
                const item = new ClipboardItem({
                    "image/png": new Promise(async (resolve, reject) => {
                        try {
                            const canvas = await html2canvas(captureArea, {
                                scale: 2,
                                backgroundColor: '#fce4ec',
                                useCORS: true,
                                allowTaint: true,
                                onclone: (clonedDoc) => {
                                    clonedDoc.body.style.userSelect = 'auto';
                                    clonedDoc.body.style.webkitUserSelect = 'auto';
                                    const clonedTarget = clonedDoc.getElementById('captureArea');
                                    if (clonedTarget) {
                                        clonedTarget.style.transform = 'none';
                                    }
                                }
                            });

                            canvas.toBlob((blob) => {
                                if (blob) resolve(blob);
                                else reject(new Error("Canvas 轉圖片失敗"));
                            }, 'image/png');
                        } catch (err) {
                            reject(err);
                        }
                    })
                });

                await navigator.clipboard.write([item]);

                btn.innerText = "✅ 截圖已複製！";
                setTimeout(() => { 
                    btn.innerText = originalText; 
                    btn.disabled = false; 
                }, 2000);

            } catch (err) {
                console.error("截圖複製失敗:", err);
                btn.innerText = originalText;
                btn.disabled = false;
                alert("複製截圖失敗！\n請確認網頁是在安全連線 (https://) Roma 或本機環境下執行，或請改用手動截圖。");
            }
        }

        window.onload = function() {
            updateClock();
            if (location.hash === '#player') {
                switchView('player');
            } else {
                switchView('main');
            }
        };
    </script>
