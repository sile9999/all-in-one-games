<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 賓果連線遊戲 </title>

  <!-- 引入 html2canvas 供玩家複製畫面 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 520px; text-align: center; position: relative; }
    h1 { color: #2c3e50; margin-bottom: 16px; font-size: 22px; text-align: center; }
    
    .menu-group { margin-bottom: 16px; text-align: left; }
    .menu-group label { display: block; font-weight: bold; color: #34495e; margin-bottom: 8px; font-size: 14px; }
    
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-option { flex: 1; min-width: 55px; padding: 10px 4px; border: 2px solid #cbd5e1; border-radius: 8px; background: white; cursor: pointer; font-weight: bold; color: #475569; text-align: center; font-size: 13px; }
    .btn-option.active { border-color: #3b82f6; background-color: #eff6ff; color: #1d4ed8; }
    
    .input-box { width: 100%; padding: 10px 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 15px; font-weight: bold; outline: none; margin-bottom: 10px; }
    
    .btn-primary { width: 100%; padding: 12px; background-color: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px; transition: all 0.2s ease; }
    .btn-primary:hover { background-color: #2563eb; }
    .btn-admin { background-color: #64748b; }
    .btn-admin:hover { background-color: #475569; }
    .btn-danger { background-color: #ef4444; }
    .btn-danger:hover { background-color: #dc2626; }
    .btn-copy { background-color: #8b5cf6; }
    .btn-copy:hover { background-color: #7c3aed; }
    .btn-start { background-color: #10b981; }
    .btn-start:hover { background-color: #059669; }

    .btn-success-state { background-color: #059669 !important; color: white !important; transform: scale(0.98); }

    .room-display-box { background: #f1f5f9; border: 2px dashed #94a3b8; border-radius: 8px; padding: 12px; text-align: center; margin-top: 12px; }
    .room-number { font-size: 28px; font-weight: bold; color: #2563eb; letter-spacing: 2px; }
    .room-number.ended { color: #ef4444; font-size: 24px; letter-spacing: 0px; }

    /* 遊戲對戰區 */
    .status-bar { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-weight: bold; color: #334155; font-size: 14px; gap: 4px; }
    .status-item { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    /* 賓果叫號顯示區 / 遊戲結束置換區 */
    .bingo-caller-box { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; border-radius: 12px; padding: 12px; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); min-height: 110px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .caller-title { font-size: 12px; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }
    
    /* 叫號圖片及文字顯示容器 */
    .current-number-display { font-size: 40px; font-weight: 900; line-height: 1.1; margin: 4px 0; color: #fde047; text-shadow: 0 2px 4px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; }
    .caller-img { height: 64px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

    .grid-container { position: relative; margin-bottom: 16px; border-radius: 8px; overflow: hidden; }
    .grid { display: grid; gap: 6px; }

    /* 格子樣式 (改為可顯示圖片並維持圓角與置中) */
    .tile { aspect-ratio: 1; background-color: #e2e8f0; border-radius: 6px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s, background-color 0.2s; position: relative; overflow: hidden; padding: 4px; }
    .tile img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .tile:hover { transform: scale(1.04); }
    
    /* 修正點 2：玩家頁點擊對中的格子底色改成 Tiffany 藍 (#81d8d0) */
    .tile.marked { background-color: #81d8d0; color: #0f172a; transform: scale(0.96); box-shadow: inset 0 2px 4px rgba(0,0,0,0.15); }
    .tile.marked img { filter: brightness(1.05); }
    
    .tile.error { background-color: #fca5a5; animation: shake 0.3s; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    .leaderboard { background: #eff6ff; border: 2px solid #bfdbfe; padding: 12px; border-radius: 8px; margin-top: 16px; text-align: left; }
    .leaderboard-title { font-size: 14px; font-weight: bold; color: #1e40af; margin-bottom: 8px; }
    .leaderboard-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; color: #334155; border-bottom: 1px dashed #cbd5e1; }
    .leaderboard-item.me { font-weight: bold; color: #2563eb; }
    .sub-info { font-size: 11px; color: #64748b; margin-left: 4px; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 360px; text-align: center; }
    
    .ended-card { background: white; padding: 32px 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 420px; width: 100%; }
    .ended-icon { font-size: 48px; margin-bottom: 12px; }

    .hidden { display: none !important; }
    .disabled-area { opacity: 0.5; pointer-events: none; }
  </style>

  <!-- 防 F12 腳本 -->
  <script>
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    document.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) { e.preventDefault(); return false; }
      if ((e.ctrlKey || e.metaKey) && ['U','u'].includes(e.key)) { e.preventDefault(); return false; }
    });

    setInterval(() => {
      const startTime = performance.now();
      (function() { return false; }).constructor("debugger")();
      const endTime = performance.now();
      if (endTime - startTime > 100) {
        document.body.innerHTML = '<h1 style="color:red; text-align:center; margin-top:20%; font-family:sans-serif;">⚠️ 系統偵測到開發者工具，禁止開啟！</h1>';
      }
    }, 500);
  </script>

  <!-- JS 模組載入 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfajfgTmrYRSo7lyRa4j23rsODFzFZSRY",
      authDomain: "gogogame-ce8ba.firebaseapp.com",
      databaseURL: "https://gogogame-ce8ba-default-rtdb.firebaseio.com",
      projectId: "gogogame-ce8ba",
      storageBucket: "gogogame-ce8ba.firebasestorage.app",
      messagingSenderId: "823932242561",
      appId: "1:823932242561:web:7aaea77c9d8cf300b15b80"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 建立 1~99 的數字與對應圖片 URL 對照字典
    const numberImages = {};
    for (let i = 1; i <= 99; i++) {
      numberImages[i] = `https://cdn.jsdelivr.net/gh/sile9999/my-assets@main/images/farm (${i + 1}).png`;
    }

    let eventId = null;
    let playerId = 'usr_' + Math.random().toString(36).substring(2, 7);
    let playerName = '';
    let customGameDurationSec = 60; // 預設單局時間 (秒)
    let totalTiles = 25; // 預設 5x5
    let callIntervalMs = 2000; // 預設叫號頻率 2 秒
    let startTimeMs = 0;
    let matchStartTimestamp = 0; // 實際開始比賽時間點
    let adminStatusTimer = null; // 控制頁面狀態自動比對計時器
    
    // 賓果狀態變數
    let gridNumbers = [];
    let markedIndices = new Set();
    let currentDrawn = null;
    let completedLineCount = 0;
    let firstLineTimeSec = null;
    
    let timer = null;
    let callerTimer = null;
    let waitTimer = null;
    let eventRef = null;
    let currentLeaderboard = {};
    let isGameActive = false;
    let globalCallList = []; // 全國一致叫號順序

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('admin-unlock-btn').addEventListener('click', openAdminModal);
      document.getElementById('pwd-check-btn').addEventListener('click', checkPassword);
      document.getElementById('pwd-cancel-btn').addEventListener('click', () => closeModal('pwd-modal'));
      document.getElementById('create-event-btn').addEventListener('click', createEvent);
      document.getElementById('force-end-btn').addEventListener('click', forceEndGameByAdmin);
      document.getElementById('open-newtab-btn').addEventListener('click', openJoinModalNewTab);
      document.getElementById('copy-link-btn').addEventListener('click', function() { copyEventLink(this); });
      document.getElementById('copy-score-btn').addEventListener('click', function() { copyScores(this); });
      document.getElementById('join-game-btn').addEventListener('click', joinIndividualGame);
      document.getElementById('copy-board-btn').addEventListener('click', function() { copyBoardToClipboard(this); });

      setupOptionGroup('grid-options', (val) => totalTiles = parseInt(val));

      // 預設開始時間為 1 分鐘後
      const now = new Date();
      const startDef = new Date(now.getTime() + 60000);
      document.getElementById('admin-starttime-input').value = formatDateForInput(startDef);

      const urlParams = new URLSearchParams(window.location.search);
      const eventParam = urlParams.get('event');

      if (eventParam) {
        document.getElementById('main-setup-view').classList.add('hidden');
        eventId = eventParam;
        
        get(ref(db, 'events_bingo_v2/' + eventId)).then((snapshot) => {
          if (!snapshot.exists()) {
            alert('找不到該活動代號，請確認後重試！');
            document.getElementById('main-setup-view').classList.remove('hidden');
            return;
          }

          const data = snapshot.val();
          const nowMs = Date.now();
          const durationMs = (data.customGameDurationSec || 60) * 1000;
          const endTimeMs = data.startTime + durationMs;
          
          if (data.isEnded || nowMs >= endTimeMs) {
            showEventEndedView('本次賓果活動已結束');
            return;
          }

          if (nowMs >= data.startTime) {
            showEventEndedView('活動比賽已開始，下次請早');
            return;
          }

          document.getElementById('input-event-id').value = eventId;
          document.getElementById('join-modal').classList.remove('hidden');
        }).catch((error) => {
          alert('讀取活動失敗：' + error.message);
          document.getElementById('main-setup-view').classList.remove('hidden');
        });
      }
    });

    function formatDateForInput(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    function showEventEndedView(msg = '本次賓果活動已結束') {
      document.getElementById('main-setup-view').classList.add('hidden');
      document.getElementById('join-modal').classList.add('hidden');
      document.getElementById('player-game-view').classList.add('hidden');
      
      document.getElementById('ended-title-text').innerText = msg;
      document.getElementById('event-ended-view').classList.remove('hidden');

      onValue(ref(db, `events_bingo_v2/${eventId}`), (snap) => {
        const evData = snap.val();
        if (evData) {
          renderLeaderboard('ended-leaderboard-list', evData.scores || {});
        }
      });
    }

    function setupOptionGroup(groupId, callback) {
      const group = document.getElementById(groupId);
      group.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-option')) {
          Array.from(group.children).forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          callback(e.target.dataset.val);
        }
      });
    }

    /* ---------------- 管理者機制 ---------------- */
    function openAdminModal() {
      document.getElementById('pwd-modal').classList.remove('hidden');
    }

    function checkPassword() {
      const pwd = document.getElementById('admin-pwd').value;
      if (pwd === '17696969') {
        document.getElementById('pwd-modal').classList.add('hidden');
        document.getElementById('setting-fields').classList.remove('disabled-area');
        document.getElementById('admin-create-actions').classList.remove('hidden');
        
        const unlockBtn = document.getElementById('admin-unlock-btn');
        unlockBtn.innerText = '✅ 管理者權限已解鎖';
        unlockBtn.classList.add('btn-success-state');
      } else {
        alert('密碼錯誤！');
      }
    }

    function createEvent() {
      const startTimeStr = document.getElementById('admin-starttime-input').value;

      if (!startTimeStr) {
        alert('請先設定「活動開始時間」！');
        return;
      }

      customGameDurationSec = parseInt(document.getElementById('admin-duration-input').value);
      if (isNaN(customGameDurationSec) || customGameDurationSec <= 0) {
        alert('請輸入有效的單局戰鬥秒數！');
        return;
      }

      const speedSecInput = parseFloat(document.getElementById('admin-speed-input').value);
      if (isNaN(speedSecInput) || speedSecInput <= 0) {
        alert('請輸入有效的賓果叫號速度（大於 0 的秒數）！');
        return;
      }
      callIntervalMs = Math.round(speedSecInput * 1000);

      const noteText = document.getElementById('admin-note-input').value.trim();
      const calculatedStartMs = new Date(startTimeStr).getTime();

      eventId = Math.floor(100000 + Math.random() * 900000).toString();
      eventRef = ref(db, 'events_bingo_v2/' + eventId);

      const seed = Math.floor(Math.random() * 1000000);

      set(eventRef, {
        customGameDurationSec: customGameDurationSec,
        totalTiles: totalTiles,
        callIntervalMs: callIntervalMs,
        startTime: calculatedStartMs,
        seed: seed,
        isEnded: false,
        note: noteText,
        scores: {}
      }).then(() => {
        const roomNumEl = document.getElementById('room-num-display');
        roomNumEl.innerText = eventId;
        roomNumEl.classList.remove('ended');
        
        document.getElementById('admin-action-area').classList.remove('hidden');
        alert(`🎉 賓果活動建立成功！活動代號為：${eventId}`);
      }).catch((error) => {
        alert('建立失敗，請檢查網路連線：' + error.message);
      });

      onValue(eventRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        checkRoomStatus(data);
        currentLeaderboard = data.scores || {};
        renderLeaderboard('admin-leaderboard-list', currentLeaderboard);

        // 開啟定時器持續比對「現在時間」是否已超過「該局結束時間」
        if (adminStatusTimer) clearInterval(adminStatusTimer);
        adminStatusTimer = setInterval(() => {
          checkRoomStatus(data);
        }, 1000);
      });
    }

    // 檢查房間狀態 (比對「現在時間」與「結束時間」)
    function checkRoomStatus(data) {
      const roomNumEl = document.getElementById('room-num-display');
      if (!roomNumEl) return;

      const durationMs = (data.customGameDurationSec || 60) * 1000;
      const endTime = data.startTime + durationMs;
      const now = Date.now();

      if (data.isEnded || now > endTime) {
        roomNumEl.innerText = '該局結束';
        roomNumEl.classList.add('ended');
      } else {
        roomNumEl.innerText = eventId;
        roomNumEl.classList.remove('ended');
      }
    }

    function forceEndGameByAdmin() {
      if (!eventId) return;
      if (confirm('⚠️ 確定要立即強制結束本局比賽嗎？所有玩家將會被強制結算！')) {
        update(ref(db, 'events_bingo_v2/' + eventId), { isEnded: true }).then(() => {
          const roomNumEl = document.getElementById('room-num-display');
          roomNumEl.innerText = '該局結束';
          roomNumEl.classList.add('ended');
          alert('已成功結束本局遊戲！');
        });
      }
    }

    function copyEventLink(btn) {
      if (!eventId) return;
      const baseUrl = window.location.origin + window.location.pathname;
      const fullLink = `${baseUrl}?event=${eventId}`;
      const timeText = customGameDurationSec + ' 秒';
      const speedText = (callIntervalMs / 1000) + ' 秒/個';
      const startText = document.getElementById('admin-starttime-input').value.replace('T', ' ');
      const noteText = document.getElementById('admin-note-input').value.trim() || '無';

      let copyMsg = `🎰 種菜賓果遊戲\n`;
      copyMsg += `🔗 挑戰連結：${fullLink}\n`;
      copyMsg += `⏰ 開賽時間：${startText}\n`;
      copyMsg += `⏱️ 戰鬥時間：${timeText}\n`;
      copyMsg += `⚡ 叫號速度：${speedText}\n`;
      copyMsg += `💡 遊戲說明：大家同步對號！只有點擊「當前叫號」才算成功，看誰連線最多條！\n`;
      copyMsg += `📝 備註：${noteText}\n`;

      navigator.clipboard.writeText(copyMsg).then(() => {
        triggerButtonFeedback(btn, '✅ 已複製活動連結！', '📋 複製活動連結');
      }).catch(() => {});
    }

    function copyScores(btn) {
      if (!currentLeaderboard || Object.keys(currentLeaderboard).length === 0) {
        return alert('目前尚無玩家成績！');
      }
      const sorted = Object.values(currentLeaderboard).sort((a, b) => b.lines - a.lines || (a.firstLineTime || 999) - (b.firstLineTime || 999) || b.clicks - a.clicks);
      let text = `🏆【 種菜賓果連線賽 - 總排行榜】\n📍 活動代號：${eventId || '無'}\n-------------------\n`;
      sorted.forEach((p, idx) => { 
        const lineTimeStr = p.firstLineTime !== null && p.firstLineTime !== undefined ? `${p.firstLineTime}s` : '--';
        text += `第 ${idx + 1} 名: ${p.name} - ${p.lines || 0} 條線 (成功: ${p.clicks || 0} 格, 首連線: ${lineTimeStr})\n`; 
      });

      navigator.clipboard.writeText(text).then(() => {
        triggerButtonFeedback(btn, '✅ 已複製戰報成績！', '🏆 複製總排行榜成績');
      }).catch(() => {});
    }

    function triggerButtonFeedback(btnElement, activeText, originalText) {
      if (!btnElement) return;
      btnElement.innerText = activeText;
      btnElement.classList.add('btn-success-state');
      setTimeout(() => {
        btnElement.innerText = originalText;
        btnElement.classList.remove('btn-success-state');
      }, 1200);
    }

    function openJoinModalNewTab() {
      const baseUrl = window.location.origin + window.location.pathname;
      const targetUrl = eventId ? `${baseUrl}?event=${eventId}` : baseUrl;
      window.open(targetUrl, '_blank');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    /* ---------------- 虛擬偽隨機算法 (全台統一叫號) ---------------- */
    function pseudoRandom(seed) {
      let value = seed;
      return function() {
        value = (value * 9301 + 49297) % 233280;
        return value / 233280;
      };
    }

    function generateGlobalCallList(seed) {
      const rng = pseudoRandom(seed);
      const list = Array.from({ length: 99 }, (_, i) => i + 1);
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    /* ---------------- 玩家賓果挑戰遊戲邏輯 ---------------- */
    function joinIndividualGame() {
      const inputEvent = document.getElementById('input-event-id').value.trim();
      const inputName = document.getElementById('input-player-name').value.trim();

      if (!inputEvent) return alert('請輸入活動代號！');
      if (!inputName) return alert('請輸入暱稱！');

      eventId = inputEvent;
      playerName = inputName;
      eventRef = ref(db, 'events_bingo_v2/' + eventId);

      get(eventRef).then((snapshot) => {
        if (!snapshot.exists()) {
          alert('找不到該活動代號，請確認後重試！');
          return;
        }

        const data = snapshot.val();
        const nowMs = Date.now();
        const durationMs = (data.customGameDurationSec || 60) * 1000;
        const endTimeMs = data.startTime + durationMs;
        
        if (data.isEnded || nowMs >= endTimeMs) {
          showEventEndedView('本次賓果活動已結束');
          return;
        }

        if (nowMs >= data.startTime) {
          showEventEndedView('活動比賽已開始，下次請早');
          return;
        }

        customGameDurationSec = data.customGameDurationSec || 60;
        totalTiles = data.totalTiles || 25;
        callIntervalMs = data.callIntervalMs || 2000;
        startTimeMs = data.startTime || Date.now();
        
        globalCallList = generateGlobalCallList(data.seed || 12345);

        document.getElementById('join-modal').classList.add('hidden');
        document.getElementById('main-setup-view').classList.add('hidden');
        document.getElementById('player-game-view').classList.remove('hidden');

        document.getElementById('player-name-display').innerText = playerName;

        update(ref(db, `events_bingo_v2/${eventId}/scores/${playerId}`), {
          name: playerName,
          lines: 0,
          clicks: 0,
          firstLineTime: null,
          timestamp: Date.now()
        });

        onValue(eventRef, (snap) => {
          const evData = snap.val();
          if (evData) {
            renderLeaderboard('player-leaderboard-list', evData.scores || {});
            if (evData.isEnded && isGameActive) {
              endPersonalGame(true, '🛑 管理者已強制結束本局比賽！');
            }
          }
        });

        prepareBoardAndCountdown();
      }).catch((error) => {
        alert('讀取活動失敗：' + error.message);
      });
    }

    function prepareBoardAndCountdown() {
      completedLineCount = 0;
      firstLineTimeSec = null;
      markedIndices = new Set();

      const personalPool = Array.from({ length: 99 }, (_, i) => i + 1);
      shuffleArray(personalPool);
      gridNumbers = personalPool.slice(0, totalTiles);
      renderGrid();

      document.getElementById('lines-display').innerText = '0';
      document.getElementById('room-tag-display').innerText = '活動: ' + eventId;

      const now = Date.now();
      if (now < startTimeMs) {
        document.getElementById('caller-title-label').innerText = 'COUNTDOWN 開賽倒數';
        
        if (waitTimer) clearInterval(waitTimer);
        
        waitTimer = setInterval(() => {
          const current = Date.now();
          const diffSec = Math.ceil((startTimeMs - current) / 1000);
          if (diffSec <= 0) {
            clearInterval(waitTimer);
            document.getElementById('caller-title-label').innerText = 'CURRENT CALL 全國同步號碼';
            startBingoGame();
          } else {
            document.getElementById('current-call-number').innerHTML = diffSec + 's';
          }
        }, 300);
      } else {
        document.getElementById('caller-title-label').innerText = 'CURRENT CALL 全國同步號碼';
        startBingoGame();
      }
    }

    function startBingoGame() {
      isGameActive = true;
      matchStartTimestamp = Date.now();
      
      document.getElementById('bingo-caller-block').classList.remove('hidden');
      document.getElementById('ended-action-block').classList.add('hidden');

      let seconds = customGameDurationSec;
      document.getElementById('time-display').innerText = seconds + 's';

      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        seconds--;
        document.getElementById('time-display').innerText = seconds + 's';

        if (seconds <= 0) {
          endPersonalGame(false, '⌛ 個人戰鬥時間結束！');
        }
      }, 1000);

      if (callerTimer) clearInterval(callerTimer);
      updateSynchronizedCall();
      callerTimer = setInterval(updateSynchronizedCall, 200);
    }

    function updateSynchronizedCall() {
      if (!isGameActive) return;
      const elapsed = Date.now() - startTimeMs;
      if (elapsed < 0) return;

      const callIndex = Math.floor(elapsed / callIntervalMs);

      if (callIndex < globalCallList.length) {
        currentDrawn = globalCallList[callIndex];
        
        // 叫號改用圖片渲染 (修正：加上 crossOrigin = "anonymous" 允許 html2canvas 擷取)
        const callContainer = document.getElementById('current-call-number');
        if (numberImages[currentDrawn]) {
          const img = document.createElement('img');
          img.src = numberImages[currentDrawn];
          img.alt = currentDrawn;
          img.className = 'caller-img';
          img.crossOrigin = "anonymous";
          callContainer.innerHTML = '';
          callContainer.appendChild(img);
        } else {
          callContainer.innerText = currentDrawn;
        }
      } else {
        endPersonalGame(false, '🎉 所有號碼已叫完！');
      }
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function renderGrid() {
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';
      
      const sideLength = Math.sqrt(totalTiles);
      gridEl.style.gridTemplateColumns = `repeat(${sideLength}, 1fr)`;

      gridNumbers.forEach((val, idx) => {
        const tile = document.createElement('div');
        let tileClass = 'tile';
        if (markedIndices.has(idx)) tileClass += ' marked';

        tile.className = tileClass;
        
        // 盤面數字改用圖片渲染 (修正：加上 crossOrigin = "anonymous" 允許 html2canvas 擷取)
        if (numberImages[val]) {
          const img = document.createElement('img');
          img.src = numberImages[val];
          img.alt = val;
          img.crossOrigin = "anonymous";
          tile.appendChild(img);
        } else {
          tile.innerText = val;
        }

        tile.onclick = () => handleTileClick(idx);
        gridEl.appendChild(tile);
      });
    }

    function handleTileClick(index) {
      if (!isGameActive) return;
      if (markedIndices.has(index)) return;

      const clickedNum = gridNumbers[index];

      if (clickedNum === currentDrawn) {
        markedIndices.add(index);
        checkBingoLines();
        renderGrid();
        
        syncPlayerScoreToFirebase();
      } else {
        const tiles = document.querySelectorAll('.tile');
        tiles[index]?.classList.add('error');
        setTimeout(() => {
          tiles[index]?.classList.remove('error');
        }, 400);
      }
    }

    function checkBingoLines() {
      const N = Math.sqrt(totalTiles);
      let linesFound = 0;

      for (let r = 0; r < N; r++) {
        let complete = true;
        for (let c = 0; c < N; c++) {
          if (!markedIndices.has(r * N + c)) complete = false;
        }
        if (complete) linesFound++;
      }

      for (let c = 0; c < N; c++) {
        let complete = true;
        for (let r = 0; r < N; r++) {
          if (!markedIndices.has(r * N + c)) complete = false;
        }
        if (complete) linesFound++;
      }

      let diag1Complete = true;
      for (let i = 0; i < N; i++) {
        if (!markedIndices.has(i * N + i)) diag1Complete = false;
      }
      if (diag1Complete) linesFound++;

      let diag2Complete = true;
      for (let i = 0; i < N; i++) {
        if (!markedIndices.has(i * N + (N - 1 - i))) diag2Complete = false;
      }
      if (diag2Complete) linesFound++;

      if (linesFound > 0 && completedLineCount === 0 && firstLineTimeSec === null) {
        firstLineTimeSec = Math.round((Date.now() - matchStartTimestamp) / 1000);
      }

      completedLineCount = linesFound;
      document.getElementById('lines-display').innerText = completedLineCount;

      if (markedIndices.size === totalTiles) {
        endPersonalGame(false, '🏆 全盤完成（Full House）！');
      }
    }

    function syncPlayerScoreToFirebase() {
      update(ref(db, `events_bingo_v2/${eventId}/scores/${playerId}`), {
        name: playerName,
        lines: completedLineCount,
        clicks: markedIndices.size,
        firstLineTime: firstLineTimeSec,
        timestamp: Date.now()
      });
    }

    function endPersonalGame(isEventExpired = false, reason = '') {
      isGameActive = false;
      if (timer) clearInterval(timer);
      if (callerTimer) clearInterval(callerTimer);
      
      document.getElementById('bingo-caller-block').classList.add('hidden');
      document.getElementById('ended-action-block').classList.remove('hidden');
      document.getElementById('ended-reason-text').innerText = `${reason} 最終達成：${completedLineCount} 條連線 (點擊 ${markedIndices.size} 格)`;

      syncPlayerScoreToFirebase();
    }

    function copyBoardToClipboard(btnElement) {
      const captureArea = document.getElementById('capture-board-area');

      // 修正：開啟 useCORS: true 與 allowTaint: true 以便截圖跨域 CDN 圖片
      html2canvas(captureArea, { 
        scale: 2,
        useCORS: true,
        allowTaint: true
      }).then(canvas => {
        canvas.toBlob(blob => {
          if (!blob) return alert('複製畫面失敗！');
          
          try {
            const item = new ClipboardItem({ 'image/png': blob });
            navigator.clipboard.write([item]).then(() => {
              triggerButtonFeedback(btnElement, '✅ 盤面畫面已成功複製！', '📋 複製盤面畫面');
            }).catch(err => {
              alert('您的瀏覽器不支援直接複製圖片，請手動截圖！');
            });
          } catch (e) {
            alert('您的瀏覽器不支援直接複製圖片，請手動截圖！');
          }
        }, 'image/png');
      });
    }

    function renderLeaderboard(elementId, scoresObj) {
      const lbEl = document.getElementById(elementId);
      if (!lbEl) return;

      const sorted = Object.entries(scoresObj || {})
        .map(([id, p]) => ({ id, ...p }))
        .sort((a, b) => {
          if ((b.lines || 0) !== (a.lines || 0)) return (b.lines || 0) - (a.lines || 0);
          const timeA = a.firstLineTime !== null && a.firstLineTime !== undefined ? a.firstLineTime : 999999;
          const timeB = b.firstLineTime !== null && b.firstLineTime !== undefined ? b.firstLineTime : 999999;
          if (timeA !== timeB) return timeA - timeB;
          return (b.clicks || 0) - (a.clicks || 0);
        });

      lbEl.innerHTML = sorted.map((p, idx) => {
        const lineTimeStr = p.firstLineTime !== null && p.firstLineTime !== undefined ? `${p.firstLineTime}s` : '--';
        return `
          <div class="leaderboard-item ${p.id === playerId ? 'me' : ''}">
            <span>#${idx + 1} ${p.name} ${p.id === playerId ? '(你)' : ''}</span>
            <div>
              <span><b>${p.lines || 0}</b> 條線</span>
              <span class="sub-info">(${p.clicks || 0}格 | ⚡${lineTimeStr})</span>
            </div>
          </div>
        `;
      }).join('') || '<div style="color:#94a3b8; font-size:13px; text-align:center;">尚無玩家成績</div>';
    }
  </script>
</head>
<body>

<!-- 彈窗 1：管理者驗證密碼 -->
<div id="pwd-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3 style="margin-bottom: 12px; color: #1e293b;">🔒 解鎖管理者設定</h3>

      <button id="pwd-check-btn" class="btn-primary">確認</button>
      <button id="pwd-cancel-btn" class="btn-primary btn-admin">取消</button>

  </div>
</div>

<!-- 彈窗 2：玩家暱稱輸入 -->
<div id="join-modal" class="modal-overlay hidden">

    <h3 style="margin-bottom: 8px; color: #1e293b;">🎰 參加賓果挑戰賽</h3>
    <p style="font-size: 13px; color: #64748b; margin-bottom: 12px;">請輸入您的暱稱以加入連線賽</p>
    <input type="text" id="input-event-id" class="input-box" placeholder="活動代號" style="display: none;">
    <input type="text" id="input-player-name" class="input-box" placeholder="請輸入你的暱稱">
    <button id="join-game-btn" class="btn-primary btn-start" style="margin-top: 8px;">進入遊戲盤面</button>
  </div>
</div>

<!-- 視圖：活動結束頁面 -->
<div id="event-ended-view" class="ended-card hidden">
  <div class="ended-icon">🏁</div>
  <h2 id="ended-title-text" style="color: #1e293b; margin-bottom: 8px;">本次賓果活動已結束</h2>
  <p style="color: #64748b; font-size: 14px; margin-bottom: 16px;">感謝大家的熱烈參與！以下為本次比賽的終極總排行榜：</p>
  
  <div class="leaderboard" style="margin-top: 0;">
    <div class="leaderboard-title">🏆 最終總排行榜</div>
    <div id="ended-leaderboard-list"></div>
  </div>
</div>

<!-- 主介面 1：管理者發起活動建立 -->
<div id="main-setup-view" class="container">
  <h1>🎰 Make 賓果連線賽 </h1>

  <button id="admin-unlock-btn" class="btn-primary btn-admin" style="margin-bottom: 16px;">🔓 點此輸入密碼解鎖管理者設定</button>

  <div id="setting-fields" class="disabled-area">
    <div class="menu-group">
      <label>1. 設定比賽盤面大小</label>
      <!-- 修正點 1：新增 7x7, 8x8, 9x9 選項 -->
      <div id="grid-options" class="btn-group">
        <div class="btn-option" data-val="9">3x3</div>
        <div class="btn-option" data-val="16">4x4</div>
        <div class="btn-option active" data-val="25">5x5</div>
        <div class="btn-option" data-val="36">6x6</div>
        <div class="btn-option" data-val="49">7x7</div>
        <div class="btn-option" data-val="64">8x8</div>
        <div class="btn-option" data-val="81">9x9</div>

    </div>

    <div class="menu-group">
      <label>2. 統一開賽時間</label>
      <input type="datetime-local" id="admin-starttime-input" class="input-box">
    </div>

    <div class="menu-group">
      <label>3. 個人戰鬥時間 (秒)</label>
      <input type="number" id="admin-duration-input" class="input-box" value="60" min="10" placeholder="例如: 60">
    </div>

    <div class="menu-group">
      <label>4. 賓果叫號速度 (秒/個)</label>
      <input type="number" step="0.5" id="admin-speed-input" class="input-box" value="2" min="0.5" placeholder="例如: 2">
    </div>

    <div class="menu-group">
      <label>5. 比賽備註說明 (可不填)</label>
      <input type="text" id="admin-note-input" class="input-box" placeholder="例如：前三名有小禮物！">
    </div>
  </div>

  <div id="admin-create-actions" class="hidden">
    <button id="create-event-btn" class="btn-primary btn-start">🚀 建立賓果賽事</button>
  </div>

  <div id="admin-action-area" class="hidden">
    <div class="room-display-box">
      <div style="font-size: 13px; color: #64748b;">房間號碼</div>
      <div id="room-num-display" class="room-number">------</div>
    </div>

    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
      <button id="copy-link-btn" class="btn-primary btn-copy">📋 複製活動連結</button>
      <button id="open-newtab-btn" class="btn-primary">↗️ 開啟對戰分頁</button>
      <button id="copy-score-btn" class="btn-primary btn-copy">🏆 複製總排行榜成績</button>
    </div>

    <div class="leaderboard">
      <div class="leaderboard-title">📊 玩家排行榜</div>
      <div id="admin-leaderboard-list"></div>
    </div>
  </div>
</div>

<!-- 主介面 2：玩家挑戰對戰畫面 -->
<div id="player-game-view" class="container hidden">
  <!-- 可截圖複製區塊 -->
  <div id="capture-board-area" style="background: white; padding: 12px; border-radius: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h1 style="margin-bottom: 0; font-size: 20px;">🎰 Make 賓果戰報</h1>
      <span id="room-tag-display" style="font-size: 12px; background: #e2e8f0; padding: 2px 8px; border-radius: 12px; font-weight: bold; color: #475569;"></span>
    </div>

    <div class="status-bar">
      <div class="status-item">👤 玩家: <span id="player-name-display">--</span></div>
      <div class="status-item">⏱️ 時間: <span id="time-display" style="color: #ef4444;">--s</span></div>
      <div class="status-item">🎉 連線: <span id="lines-display" style="color: #10b981; font-size: 16px;">0</span> 條</div>
    </div>

    <div id="bingo-caller-block" class="bingo-caller-box">
      <div id="caller-title-label" class="caller-title">CURRENT CALL 全國同步號碼</div>
      <div id="current-call-number" class="current-number-display">--</div>
    </div>

    <div id="ended-action-block" class="bingo-caller-box hidden" style="background: linear-gradient(135deg, #334155, #475569);">
      <div id="ended-reason-text" style="font-size: 15px; font-weight: bold; color: #fde047;">比賽已結束</div>
    </div>

    <div class="grid-container">
      <div id="grid" class="grid"></div>
    </div>
  </div>

  <button id="copy-board-btn" class="btn-primary btn-copy" style="margin-top: 4px; margin-bottom: 12px;">📋 複製盤面畫面</button>

  <div class="leaderboard">
    <div class="leaderboard-title">🏆 全國排行榜</div>
    <div id="player-leaderboard-list"></div>
  </div>
</div>

</body>
